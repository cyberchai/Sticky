<script>
'use strict';

/* ------------------------------------------------------------------ *
 * Tunables
 * ------------------------------------------------------------------ */
const LOOP = 2.4;            // seconds per loop
const STEP = 1 / 240;        // fixed physics step
const BASE_Y = 684;          // baseline the letters are glued to
const MIN_W = 8;             // thinnest a goo strand gets before the filter eats it
const G = 2600;              // gravity for falling drips (viewBox units / s²)

const spring = (hz, zeta) => ({ k: (2 * Math.PI * hz) ** 2, c: 2 * zeta * 2 * Math.PI * hz });
const LETTER_SPRING  = spring(4.5, 0.5);  // in the air: snappy, a little give
const CONTACT_SPRING = spring(9.0, 0.7);  // touching floor / neighbour: a quick squish, then stuck
const GRAB_SPRING    = spring(4.5, 0.75);
const DOT_SPRING     = spring(3.4, 0.2);  // the i-dot on its string: boing
const YOYO_SPRING    = spring(14, 0.8);   // tight tracking while the dot does its yo-yo

// How much a dragged letter drags its neighbours along (by distance in the word)…
const COUPLING = [1, 0.28, 0.08, 0.02];
// …unless it's shoving into them, in which case they get pushed out of the way.
const PUSH = 0.9;

// The cursor is a sticky fingertip: how far a touched letter / the i-dot follows it,
// and how far the honey stretches before it lets go.
const FINGER = {
  letter: { gain: 0.3,  max: 55, snap: 170 },
  dot:    { gain: 0.6,  max: 200, snap: 150 },
};
const CURIOSITY = { reach: 240, gain: 0.1, max: 22 }; // the i-dot leaning toward a nearby cursor
const IDLE_POP = 6; // seconds of stillness before the logo pops on its own, as an invitation

/* ------------------------------------------------------------------ *
 * Logo geometry (traced from the artwork, viewBox 1536×1024)
 * ------------------------------------------------------------------ */
// `peel` is where each letter pops to: a hair apart, a hair up.
const pieces = [
  { id: 's',  cx: 247,  inward:  1, peel: [-10, -18] },
  { id: 'ti', cx: 528,  inward:  1, peel: [ -4, -24] },
  { id: 'c',  cx: 764,  inward: -1, peel: [  4, -21] },
  { id: 'ky', cx: 1124, inward: -1, peel: [ 10, -16] },
].map((p, i) => ({ ...p, i, x: 0, y: 0, vx: 0, vy: 0, gx: 0, gy: 0, el: null }));
const byId = Object.fromEntries(pieces.map(p => [p.id, p]));

// The i-dot hangs off the "ti" ligature by a hairline neck. Points of the ti outline
// above NECK_BASE (and right of NECK_X) belong to the neck; above DOT_TOP, the dot.
const NECK_X = 565, NECK_BASE = 414, DOT_TOP = 334, DOT_C = [660, 294];
// The neck is the dot's yo-yo string, running from under the dot down to the stem.
const NECK_TOP = [636, 334], NECK_FOOT = [588, 412];
const NECK_LEN = Math.hypot(NECK_TOP[0] - NECK_FOOT[0], NECK_TOP[1] - NECK_FOOT[1]);
const STRING_DIR = [(NECK_FOOT[0] - NECK_TOP[0]) / NECK_LEN, (NECK_FOOT[1] - NECK_TOP[1]) / NECK_LEN]; // dot → stem
const NECK_BULGE = 10; // how far the goo collar under a reeled-in dot flares out on each side
// Centre of the neck for each row of the outline (DOT_TOP..NECK_BASE), so the bulge pushes both edges outward.
const NECK_MID = (() => {
  const P = LOGO.tiPoly, mid = {};
  for (let y = DOT_TOP; y <= NECK_BASE; y++) {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < P.length; i += 2) {
      const j = (i + 2) % P.length, y1 = P[i + 1], y2 = P[j + 1];
      if (y1 === y2 || (y1 - y) * (y2 - y) > 0) continue;
      const x = P[i] + (P[j] - P[i]) * (y - y1) / (y2 - y1);
      if (x > NECK_X && x < 680) { lo = Math.min(lo, x); hi = Math.max(hi, x); }
    }
    mid[y] = (lo + hi) / 2;
  }
  return mid;
})();

// The dot is drawn as its own shape so it can slide down its neck like a bead on a string.
// The two pieces overlap between BODY_CUT and DOT_CUT, so no seam shows at rest.
const BODY_CUT = 342, DOT_CUT = 348;
const [TI_BODY, TI_DOT] = (() => {
  const P = LOGO.tiPoly, n = P.length / 2;
  const inDot = (i, yCut) => P[2 * i] > NECK_X && P[2 * i + 1] < yCut;
  let start = 0;
  while (inDot(start, DOT_CUT)) start++; // walk the outline from a point outside the dot
  const order = Array.from({ length: n }, (_, k) => (start + k) % n);
  const pts = idx => idx.flatMap(i => [P[2 * i], P[2 * i + 1]]);
  return [pts(order.filter(i => !inDot(i, BODY_CUT))), pts(order.filter(i => inDot(i, DOT_CUT)))];
})();
const dot = { x: 0, y: 0, vx: 0, vy: 0, gx: 0, gy: 0 };

// Where neighbouring letters (almost) touch — goo strands stretch between these.
// Strands with `snapAt` break once stretched that far; the rest hold and pull the letters home.
const PAIRS = [
  { a: 's',  b: 'ti', pa: [383.9, 428.6], pb: [390.3, 431.8], w: 16, snapAt: 46 },
  { a: 's',  b: 'ti', pa: [359.9, 565.6], pb: [370.3, 568.0], w: 30 },
  { a: 's',  b: 'ti', pa: [345.9, 622.6], pb: [355.1, 624.0], w: 24, snapAt: 58 },
  { a: 'ti', b: 'c',  pa: [613.5, 560.5], pb: [627.8, 563.9], w: 30 },
  { a: 'ti', b: 'c',  pa: [625.0, 627.6], pb: [628.6, 625.5], w: 20 },
  { a: 'c',  b: 'ky', pa: [856.0, 586.7], pb: [869.3, 590.4], w: 16 },
  { a: 'c',  b: 'ky', pa: [898.7, 445.0], pb: [914.0, 449.9], w: 14, snapAt: 48 },
].map(s => ({ ...s, rest: Math.hypot(s.pb[0] - s.pa[0], s.pb[1] - s.pa[1]), snapped: false, tSnap: 0, len: 0 }));

// Bottom contacts glued to the floor — strands stretch down to here when lifted.
const FLOOR = [
  { p: 's',  x: 167, y: 680.3, w: 24, snapAt: 15 },
  { p: 's',  x: 244, y: 680.6, w: 34 },
  { p: 'ti', x: 411, y: 685.2, w: 32 },
  { p: 'ti', x: 529, y: 683.7, w: 22 },
  { p: 'c',  x: 690, y: 681.0, w: 24, snapAt: 17 },
  { p: 'c',  x: 744, y: 683.0, w: 34 },
  { p: 'ky', x: 862, y: 676.9, w: 30 },
  { p: 'ky', x: 934, y: 676.9, w: 22, snapAt: 13 },
].map(f => ({ ...f, snapped: false, tSnap: 0, len: 0 }));

// Honey drips: grow → hang → let go. Timed against the loop.
const DRIP_GROW = 0.35, DRIP_HANG = 0.3;
const DRIPS = [
  { p: 'ky', x: 1042, y: 829.0, r: 13, t0: 0.85 }, // shaken loose by the landing
].map(d => ({ ...d, tDrop: d.t0 + DRIP_GROW + DRIP_HANG, dropX: 0, dropY: 0 }));

/* ------------------------------------------------------------------ *
 * Easing / maths
 * ------------------------------------------------------------------ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = (a, b, v) => { const t = seg(v, a, b); return t * t * (3 - 2 * t); };
const inOutSine = p => (1 - Math.cos(Math.PI * p)) / 2;
const outCubic = p => 1 - (1 - p) ** 3;
const inQuad = p => p * p;
const inCubic = p => p * p * p;
const outBack = p => 1 + 2.3 * (p - 1) ** 3 + 1.3 * (p - 1) ** 2; // overshoots ~6%, like a string going taut
const r1 = v => Math.round(v * 10) / 10;

/* ------------------------------------------------------------------ *
 * Timeline — one pop. A tiny squat, the word pops a hair off the floor
 * (rippling left → right), the goo catches it, and it's yanked home.
 * The i-dot yo-yos down onto the i, a few threads pop, and one small drop falls.
 * ------------------------------------------------------------------ */
const SQUAT = 0.2, POP = 0.3, TOP = 0.48, LET_GO = 0.66, LAND = 0.8; // seconds into the loop
const RIPPLE = 0.035; // delay between letters
const DIP = 4;        // how far the squat presses into the floor
const CREEP = 0.08;   // extra stretch while the goo holds at the top

// [k, dip]: k = fraction of each letter's `peel` offset, dip = px pressed into the floor.
function pop(t) {
  if (t < SQUAT || t >= LAND) return [0, 0];
  if (t < POP) return [0, DIP * inOutSine(seg(t, SQUAT, POP))];                     // squat
  if (t < TOP) { const k = outCubic(seg(t, POP, TOP)); return [k, DIP * (1 - k)]; } // pop!
  if (t < LET_GO) return [1 + CREEP * inOutSine(seg(t, TOP, LET_GO)), 0];           // the goo holds…
  return [(1 + CREEP) * (1 - inCubic(seg(t, LET_GO, LAND))), 0];                    // …and yanks it home
}

function letterTarget(p, t) {
  const [k, dip] = pop(t - p.i * RIPPLE);
  return [p.peel[0] * k, p.peel[1] * k + dip];
}

// The i-dot is a yo-yo that comes home: at the top of the pop it reels down its string
// onto the i, sticks there in a blob of goo, then is flung back out to its place —
// overshooting a touch as the string goes taut — and wobbles to a stop.
const DIVE = 0.5, CLICK = 0.62, FLING = 0.76, OUT = 0.94, YOYO_END = 1.5;
const DROP = 66; // how far the dot reels in along its string

// [x, y, squash]: the dot's offset from rest, and how squashed it is against the i (1 = not at all).
function yoyo(t) {
  let d = 0, squash = 1;
  if (t >= DIVE && t < CLICK) {                                   // reel in
    d = DROP * inCubic(seg(t, DIVE, CLICK));
  } else if (t >= CLICK && t < FLING) {                           // stuck to the i: splat, then recover
    d = DROP;
    squash = 1 - 0.15 * Math.exp(-10 * (t - CLICK)) * (1 - smooth(FLING - 0.05, FLING, t));
  } else if (t >= FLING && t < OUT) {                             // flung back out
    d = DROP * (1 - outBack(seg(t, FLING, OUT)));
  } else if (t >= OUT && t < YOYO_END) {                          // wobble on the taut string
    const s = t - OUT;
    d = -3 * Math.exp(-7 * s) * Math.sin(2 * Math.PI * 5 * s);
  }
  return [STRING_DIR[0] * d, STRING_DIR[1] * d, squash];
}

/* ------------------------------------------------------------------ *
 * Simulation
 * ------------------------------------------------------------------ */
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

let simT = 0;        // time into the current pop
let popping = false; // a pop is playing (on click, or on its own after a quiet spell)
let clock = 0;       // monotonic sim time (snap recoil, idle timer)
let grabbed = null;  // piece or dot currently held
let quietSince = 0;  // clock time of the last pointer activity

function integrateAxis(b, axis, target, sp, dt) {
  const v = axis === 'x' ? 'vx' : 'vy';
  b[v] += (sp.k * (target - b[axis]) - sp.c * b[v]) * dt;
  b[axis] += b[v] * dt;
}

function step(t, dt) {
  for (const p of pieces) {
    let [tx, ty] = popping ? letterTarget(p, t) : [0, 0];
    for (const q of pieces) {
      const d = p.i - q.i, k = COUPLING[Math.abs(d)];
      const shoving = d !== 0 && Math.sign(q.gx) === Math.sign(d); // q is dragged toward p
      tx += q.gx * (shoving ? PUSH : k);
      ty += q.gy * k;
    }
    const free = grabbed === p ? GRAB_SPRING : LETTER_SPRING;
    integrateAxis(p, 'x', tx, p.x * p.inward > 0 ? CONTACT_SPRING : free, dt);
    integrateAxis(p, 'y', ty, p.y > 0 ? CONTACT_SPRING : free, dt);
  }
  const ti = byId.ti, [ex, ey] = popping ? yoyo(t) : [0, 0];
  let dotSpring = DOT_SPRING;
  if (grabbed === dot) dotSpring = GRAB_SPRING;
  else if (popping && t >= DIVE && t < YOYO_END) dotSpring = YOYO_SPRING;
  integrateAxis(dot, 'x', ti.x + ex + dot.gx, dotSpring, dt);
  integrateAxis(dot, 'y', ti.y + ey + dot.gy, dotSpring, dt);

  const xf = xforms();
  // Remember where each drip lets go so the falling drop doesn't follow its letter.
  for (const d of DRIPS) {
    if (t < d.tDrop && t + dt >= d.tDrop) [d.dropX, d.dropY] = apply(xf[d.p], d.x, d.y);
  }
  // Over-stretched strands snap; they re-glue once the letters touch again.
  for (const s of PAIRS) { const g = pairGeom(s, xf); trackSnap(s, g.e, g.L); }
  for (const f of FLOOR) { const g = floorGeom(f, xf); trackSnap(f, g.lifted, g.lifted); }
}

function trackSnap(s, stretch, len) {
  if (s.snapped) { if (stretch < 1) s.snapped = false; }
  else if (s.snapAt && stretch > s.snapAt) Object.assign(s, { snapped: true, tSnap: clock, len });
}

let acc = 0;
function advance(dt) {
  for (acc += dt; acc >= STEP; acc -= STEP) tick();
}

function tick() {
  step(simT, STEP);
  clock += STEP;
  if (popping) {
    simT += STEP;
    if (simT >= LOOP) { popping = false; simT = 0; }
  } else if (!reducedMotion.matches && !grabbed && !stuck && clock - quietSince > IDLE_POP) {
    startPop();
  }
}

function startPop() {
  popping = true;
  simT = 0;
  quietSince = clock;
}

/* ------------------------------------------------------------------ *
 * Squash & stretch: pushing into a neighbour or the floor squashes,
 * moving fast stretches.
 * ------------------------------------------------------------------ */
function xform(p) {
  let dx = p.x, dy = p.y, sx = 1, sy = 1;
  const into = p.x * p.inward;
  if (into > 0) { dx = p.x * 0.35; sx -= into * 0.0022; sy += into * 0.0012; }
  if (p.y > 0) { dy = p.y * 0.25; sy -= p.y * 0.0028; sx += p.y * 0.0012; }
  const ex = clamp(Math.abs(p.vx) * 0.00003, 0, 0.05);
  const ey = clamp(Math.abs(p.vy) * 0.00004, 0, 0.06);
  sx *= 1 + ex - ey * 0.5;
  sy *= 1 + ey - ex * 0.5;
  return { dx, dy, sx, sy, px: p.cx, py: BASE_Y };
}
const xforms = () => Object.fromEntries(pieces.map(p => [p.id, xform(p)]));
const apply = (f, x, y) => [f.px + (x - f.px) * f.sx + f.dx, f.py + (y - f.py) * f.sy + f.dy];

/* ------------------------------------------------------------------ *
 * The ti and its i-dot, a bead on the neck
 * ------------------------------------------------------------------ */
// The dot's offset from rest (relative to the ti) and its squash & stretch, as [ox, oy, st, nx, ny]:
// it smears along its direction of travel, and splats along its string against the i.
function dotShape(squash) {
  const ti = byId.ti;
  let x = dot.x - ti.x, y = dot.y - ti.y;
  const along = x * STRING_DIR[0] + y * STRING_DIR[1];
  if (along > DROP) { // can't reel in past the stem
    const back = along - (DROP + 8 * Math.tanh((along - DROP) / 8));
    x -= STRING_DIR[0] * back; y -= STRING_DIR[1] * back;
  }
  if (squash < 1) return [x, y, squash, ...STRING_DIR];
  const vx = dot.vx - ti.vx, vy = dot.vy - ti.vy, speed = Math.hypot(vx, vy);
  if (speed < 1) return [x, y, 1, 0, 1];
  return [x, y, 1 + Math.min(speed * 0.00008, 0.25), vx / speed, vy / speed];
}

// A closed outline through a flat [x0, y0, x1, y1, …] list of points.
function polyPath(P) {
  const pts = [];
  for (let i = 0; i < P.length; i += 2) pts.push(r1(P[i]) + ' ' + r1(P[i + 1]));
  return 'M' + pts.join('L') + 'Z';
}
const TI_BODY_D = polyPath(TI_BODY), TI_DOT_D = polyPath(TI_DOT);

// The ti without its dot. [px, py] is the part of the dot's offset that drags the string
// out (its neck follows); `inward` is how far the dot has slid down the neck, which
// leaves the neck alone except for a collar of goo bulging out under the dot.
function bodyPath([px, py], inward) {
  if (Math.hypot(px, py) < 0.05 && inward < 0.05) return TI_BODY_D;
  const bulge = NECK_BULGE * clamp(inward / DROP, 0, 1);
  const seat = DOT_CUT + STRING_DIR[1] * inward - 24; // tucked up under where the dot now sits on the neck
  const P = TI_BODY, out = [];
  for (let i = 0; i < P.length; i += 2) {
    let x = P[i], y = P[i + 1];
    if (x > NECK_X && y < NECK_BASE) {
      if (bulge > 0 && y > seat) {
        const s = (y - seat) / (NECK_BASE - seat); // eases in under the dot, then tapers into the stem
        x += Math.sign(x - NECK_MID[Math.round(y)]) * bulge * smooth(0, 0.3, s) * (1 - s) ** 2;
      }
      const u = clamp((NECK_BASE - y) / (NECK_BASE - BODY_CUT), 0, 1); // 0 at stem → 1 under the dot
      x += px * u; y += py * u; // the neck pays out like a taut string
    }
    out.push(x, y);
  }
  return polyPath(out);
}

// The dot without the ti, squashed/stretched by st along (nx, ny) and 1/√st across it. Its
// tail (the top of the neck it carries along) is left out of the squash so it stays glued to the
// neck, and while sliding down it thins to match the thinner neck underneath.
function dotPath(inward, st, nx, ny) {
  if (inward < 0.05 && Math.abs(st - 1) < 0.002) return TI_DOT_D;
  const thin = lerp(1, 0.45, smooth(2, 16, inward)), perp = 1 / Math.sqrt(st);
  const [cx, cy] = DOT_C, P = TI_DOT, out = [];
  for (let i = 0; i < P.length; i += 2) {
    let x = P[i], y = P[i + 1];
    if (y > DOT_TOP) {
      const mid = NECK_MID[Math.round(y)];
      x = mid + (x - mid) * lerp(1, thin, smooth(DOT_TOP, DOT_TOP + 8, y));
    }
    const w = 1 - smooth(DOT_TOP - 12, DOT_TOP + 2, y);
    if (w > 0) {
      const rx = x - cx, ry = y - cy, along = rx * nx + ry * ny, s = lerp(1, st, w), q = lerp(1, perp, w);
      x = cx + nx * along * s + (rx - nx * along) * q;
      y = cy + ny * along * s + (ry - ny * along) * q;
    }
    out.push(x, y);
  }
  return polyPath(out);
}

/* ------------------------------------------------------------------ *
 * Goo shapes
 * ------------------------------------------------------------------ */
let box; // bounds of this frame's goo, for a tight filter region
function grow(x, y, r) {
  box[0] = Math.min(box[0], x - r); box[1] = Math.min(box[1], y - r);
  box[2] = Math.max(box[2], x + r); box[3] = Math.max(box[3], y + r);
}

function ellipse(cx, cy, rx, ry) {
  grow(cx, cy, Math.max(rx, ry));
  return `M${r1(cx - rx)} ${r1(cy)}a${r1(rx)} ${r1(ry)} 0 1 0 ${r1(2 * rx)} 0a${r1(rx)} ${r1(ry)} 0 1 0 ${r1(-2 * rx)} 0Z`;
}

// An hourglass of honey from a to b: fat where it clings, thin in the middle, sagging under gravity.
// `flare` shapes the taper: low = soft catenoid, high = long thin thread with blobby ends.
function strand(ax, ay, bx, by, wa, wb, waist, sag = 0, flare = 2.4) {
  const dx = bx - ax, dy = by - ay, N = 16, left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const x = ax + dx * s, y = ay + dy * s + sag * 4 * s * (1 - s);
    let tx = dx, ty = dy + sag * 4 * (1 - 2 * s);
    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const m = Math.abs(2 * s - 1) ** flare;
    const hw = (waist + ((s < 0.5 ? wa : wb) - waist) * m) / 2;
    left.push(r1(x - ty * hw) + ' ' + r1(y + tx * hw));
    right.push(r1(x + ty * hw) + ' ' + r1(y - tx * hw));
    grow(x, y, hw);
  }
  return 'M' + left.join('L') + 'L' + right.reverse().join('L') + 'Z';
}

// What's left of a snapped strand: a stub that springs back toward its anchor, ending in a bead.
function stub(ax, ay, ux, uy, len, w, droop, out) {
  if (len < 1) return;
  const tx = ax + ux * len, ty = ay + uy * len + droop;
  out.push(strand(ax, ay, tx, ty, w, w * 0.7, Math.max(MIN_W, w * 0.45), 0, 1.6));
  out.push(ellipse(tx, ty, w * 0.42, w * 0.47));
}

function pairGeom(s, xf) {
  const [ax, ay] = apply(xf[s.a], ...s.pa), [bx, by] = apply(xf[s.b], ...s.pb);
  const L = Math.hypot(bx - ax, by - ay);
  return { ax, ay, bx, by, L, e: L - s.rest };
}

function floorGeom(f, xf) {
  const [ax, ay] = apply(xf[f.p], f.x, f.y);
  return { ax, ay, lifted: f.y - ay };
}

// Paid out (when someone drags the dot), honey clings to both ends of the i-dot's string;
// the middle is thinner than the goo filter can hold, so only the hairline neck shows there.
function yoyoString(xf, [ox, oy], out) {
  const [ax, ay] = apply(xf.ti, NECK_TOP[0] + ox, NECK_TOP[1] + oy), [bx, by] = apply(xf.ti, ...NECK_FOOT);
  const on = smooth(4, 30, Math.hypot(ax - bx, ay - by) - NECK_LEN);
  if (on < 0.01) return;
  out.push(strand(ax, ay, bx, by, 18 * on, 20 * on, 3, 0, 3));
}

function pairStrands(xf, out) {
  for (const s of PAIRS) {
    const { ax, ay, bx, by, L, e } = pairGeom(s, xf);
    const on = smooth(1, 10, e);
    if (on < 0.01) continue;
    const ux = (bx - ax) / L, uy = (by - ay) / L, inset = s.w * 0.6; // wide ends buried in the letters
    if (s.snapped) {
      const k = clock - s.tSnap;
      const len = s.len * 0.42 * Math.exp(-6 * k);
      const droop = 14 * (1 - Math.exp(-4 * k)) * Math.exp(-1.5 * k);
      stub(ax - ux * inset, ay - uy * inset, ux, uy, len + inset, s.w * 0.8, droop, out);
      stub(bx + ux * inset, by + uy * inset, -ux, -uy, len + inset, s.w * 0.8, droop, out);
      continue;
    }
    // Pinched in the middle even when short, like a real liquid bridge.
    const waist = Math.max(MIN_W, s.w * 0.55 * (24 / (24 + e)) ** 0.6) * on;
    const sag = Math.min(e * 0.22, 40) * on * Math.abs(ux);
    out.push(strand(ax - ux * inset, ay - uy * inset, bx + ux * inset, by + uy * inset, s.w * on, s.w * on, waist, sag, 1.6));
  }
}

function floorStrands(xf, out) {
  for (const f of FLOOR) {
    const { ax, ay, lifted } = floorGeom(f, xf);
    const on = smooth(1, 12, lifted);
    if (on < 0.01) continue;
    // The goo stays stuck where the letter left it, so strands lean as letters drift sideways.
    const top = ay - 8 * on, floor = f.y + 3;
    out.push(ellipse(f.x, floor, (f.w * 0.95 + lifted * 0.07) * on, 5.5 * on)); // puddle
    if (f.snapped) {
      const k = clock - f.tSnap;
      stub(ax, top, 0, 1, f.len * 0.4 * Math.exp(-9 * k) + 6, f.w * 0.8, 0, out);    // pops back to the letter
      stub(f.x, floor, 0, -1, f.len * 0.4 * Math.exp(-12 * k), f.w * 0.9, 0, out);    // slumps into the puddle
      continue;
    }
    const waist = Math.max(MIN_W, f.w * (30 / (30 + lifted)) ** 0.9) * on;
    out.push(strand(ax, top, f.x, floor, f.w * 1.15 * on, f.w * 1.4 * on, waist, 0, 1.5));
  }
}

function drips(xf, t, out) {
  for (const d of DRIPS) {
    const tau = t - d.t0, R = d.r;
    if (tau < 0) continue;
    const [ax, ay] = apply(xf[d.p], d.x, d.y);
    if (tau < DRIP_GROW) {                                 // bead swells
      const r = R * outCubic(tau / DRIP_GROW);
      out.push(ellipse(ax, ay + r * 0.25, r, r * 1.05));
    } else if (tau < DRIP_GROW + DRIP_HANG) {              // bead sags on a thinning neck
      const k = inQuad((tau - DRIP_GROW) / DRIP_HANG);
      const r = R * (1 - 0.1 * k), cy = ay + R * 0.25 + R * 3.4 * k;
      out.push(ellipse(ax, cy, r * (1 - 0.06 * k), r * (1.05 + 0.2 * k)));
      out.push(strand(ax, ay - 4, ax, cy, R * 1.5, r * 1.4, lerp(R * 1.2, R * 0.35, k), 0));
    } else {                                               // lets go; the stub recoils
      const f = tau - DRIP_GROW - DRIP_HANG;
      const cy = d.dropY + R * 3.65 + 60 * f + 0.5 * G * f * f;
      if (cy < 1200) out.push(ellipse(d.dropX, cy, R * 0.82, R * (1.25 + Math.min(f * 1.5, 0.35))));
      const decay = Math.exp(-3.2 * f), rr = R * 0.75 * decay;
      if (rr > 0.6) {
        const tail = Math.max(0, R * 2.2 * decay * Math.cos(f * 13)), ty = ay + R * 0.2 + tail;
        out.push(ellipse(ax, ty, rr, rr * 1.05));
        if (tail > 1) out.push(strand(ax, ay - 4, ax, ty, R * 1.3 * decay, rr * 1.3, R * 0.4, 0));
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */
const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const gooLayer = document.getElementById('goo');
const gooFilter = document.getElementById('goo-filter');
const letterLayer = document.getElementById('letters');
const gooPaths = [];

for (const p of pieces) {
  p.el = document.createElementNS(NS, 'path');
  p.el.setAttribute('d', p.id === 'ti' ? TI_BODY_D : LOGO[p.id]);
  p.el.dataset.id = p.id;
  letterLayer.appendChild(p.el);
}
const dotEl = letterLayer.appendChild(document.createElementNS(NS, 'path'));
dotEl.setAttribute('d', TI_DOT_D);
dotEl.dataset.id = 'ti';

function drawGoo(shapes) {
  while (gooPaths.length < shapes.length) gooPaths.push(gooLayer.appendChild(document.createElementNS(NS, 'path')));
  gooPaths.forEach((el, i) => el.setAttribute('d', shapes[i] || ''));
  gooLayer.style.display = shapes.length ? '' : 'none';
  if (shapes.length) {
    const pad = 24, [x0, y0, x1, y1] = box;
    gooFilter.setAttribute('x', r1(x0 - pad));
    gooFilter.setAttribute('y', r1(y0 - pad));
    gooFilter.setAttribute('width', r1(x1 - x0 + 2 * pad));
    gooFilter.setAttribute('height', r1(y1 - y0 + 2 * pad));
  }
}

function render() {
  const xf = xforms();
  for (const p of pieces) {
    const f = xf[p.id];
    p.transform = `translate(${r1(f.px + f.dx)} ${r1(f.py + f.dy)}) scale(${f.sx.toFixed(4)} ${f.sy.toFixed(4)}) translate(${-f.px} ${-f.py})`;
    p.el.setAttribute('transform', p.transform);
  }
  const shape = dotShape(popping ? yoyo(simT)[2] : 1), [ox, oy, st, nx, ny] = shape;
  dotNow = [ox, oy];
  // Split the dot's offset into its slide down the neck and the rest, which pulls the neck out.
  const inward = Math.max(0, ox * STRING_DIR[0] + oy * STRING_DIR[1]);
  byId.ti.el.setAttribute('d', bodyPath([ox - STRING_DIR[0] * inward, oy - STRING_DIR[1] * inward], inward));
  dotEl.setAttribute('d', dotPath(inward, st, nx, ny));
  dotEl.setAttribute('transform', `${byId.ti.transform} translate(${r1(ox)} ${r1(oy)})`);

  box = [Infinity, Infinity, -Infinity, -Infinity];
  const shapes = [];
  yoyoString(xf, shape, shapes);
  pairStrands(xf, shapes);
  floorStrands(xf, shapes);
  if (popping) drips(xf, simT, shapes);
  fingerGoo(xf, shapes);
  drawGoo(shapes);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20);
  last = now;
  advance(dt);
  checkSnap();
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ *
 * The cursor is a sticky fingertip. Touch a letter and it sticks; move
 * away and the honey stretches, dragging the letter after you, until it
 * snaps and a drop falls off your fingertip. The i-dot leans toward you
 * and can be pulled out on its string. Press and drag to grab; click to
 * make it pop.
 * ------------------------------------------------------------------ */
const hint = document.getElementById('hint');
const finger = { x: -1e4, y: -1e4 }; // the cursor, in viewBox units
let stuck = null;                     // { body, lx, ly }: where the fingertip is stuck, in that body's own coordinates
let dotNow = [0, 0];                  // the dot's last drawn offset, for hit-testing it
const snaps = [];                     // strands that just let go of the fingertip
let press = null;                     // { x, y, t } of the current press, to tell a click from a drag
let start = null;                     // drag origin, net of the grabbed body's current pull

function toSvg(e) {
  return new DOMPoint(e.clientX, e.clientY).matrixTransform(stage.getScreenCTM().inverse());
}

// Move the fingertip to the pointer; any pointer activity resets the idle timer.
function trackFinger(e) {
  const pt = toSvg(e);
  finger.x = pt.x; finger.y = pt.y;
  quietSince = clock;
  return pt;
}

// A point in a body's own coordinates (undoing its offset and squash & stretch).
function toLocal(body, x, y) {
  const f = xform(body === dot ? byId.ti : body);
  const lx = f.px + (x - f.px - f.dx) / f.sx, ly = f.py + (y - f.py - f.dy) / f.sy;
  return body === dot ? [lx - dotNow[0], ly - dotNow[1]] : [lx, ly];
}
const isOn = (body, x, y) => (body === dot ? dotEl : body.el).isPointInFill(new DOMPoint(...toLocal(body, x, y)));
const bodyAt = (x, y) => [dot, ...pieces].find(b => isOn(b, x, y)) || null;

// Where the fingertip's honey is attached right now, in viewBox units.
function anchorOf({ body, lx, ly }, xf) {
  return body === dot ? apply(xf.ti, lx + dotNow[0], ly + dotNow[1]) : apply(xf[body.id], lx, ly);
}

// The honey from that anchor out to the fingertip: where it starts, how long it is, which way it runs.
function honey(s, xf) {
  const [ax, ay] = anchorOf(s, xf), len = Math.hypot(finger.x - ax, finger.y - ay);
  return { ax, ay, len, ux: (finger.x - ax) / len, uy: (finger.y - ay) / len };
}

const fingerCfg = body => (body === dot ? FINGER.dot : FINGER.letter);

// A stuck body leans after the fingertip, harder the further it goes, up to a limit.
function followFinger({ body, lx, ly }) {
  const cfg = fingerCfg(body);
  const dx = (finger.x - lx) * cfg.gain, dy = (finger.y - ly) * cfg.gain;
  const k = cfg.max / (cfg.max + Math.hypot(dx, dy));
  body.gx = dx * k;
  body.gy = dy * k;
}

// Untouched, the i-dot leans a little toward a nearby cursor.
function curiosity() {
  if (stuck?.body === dot || grabbed === dot) return;
  const dx = finger.x - DOT_C[0], dy = finger.y - DOT_C[1], dist = Math.hypot(dx, dy);
  const near = smooth(CURIOSITY.reach, CURIOSITY.reach * 0.4, dist) * CURIOSITY.gain;
  const k = CURIOSITY.max / (CURIOSITY.max + dist * near);
  dot.gx = dx * near * k;
  dot.gy = dy * near * k;
}

function stickTo(body, x, y) {
  const [lx, ly] = toLocal(body, x, y);
  stuck = { body, lx, ly };
  hint.classList.add('gone');
}

// The fingertip lets go. Stretched honey snaps: the letter's end recoils, the rest drips off the fingertip.
function letGo() {
  if (!stuck) return;
  const { len, ux, uy } = honey(stuck, xforms());
  if (len > 12) snaps.push({ ...stuck, ux, uy, len, fx: finger.x, fy: finger.y, t0: clock });
  stuck.body.gx = stuck.body.gy = 0;
  stuck = null;
}

function checkSnap() {
  if (!stuck || grabbed === stuck.body) return;
  if (honey(stuck, xforms()).len > fingerCfg(stuck.body).snap) letGo();
}

function fingerGoo(xf, out) {
  if (stuck) {
    const { ax, ay, len, ux, uy } = honey(stuck, xf), on = smooth(4, 24, len);
    if (on > 0.01) {
      const waist = Math.max(MIN_W, 20 * (40 / (40 + len)) ** 0.8) * on;
      const sag = Math.min(len * 0.2, 40) * on * Math.abs(ux);
      out.push(strand(ax - ux * 10, ay - uy * 10, finger.x, finger.y, 24 * on, 14 * on, waist, sag, 2));
      out.push(ellipse(finger.x, finger.y, 7 * on, 8 * on)); // honey on the fingertip
    }
  }
  for (let i = snaps.length - 1; i >= 0; i--) {
    const s = snaps[i], k = clock - s.t0, [ax, ay] = anchorOf(s, xf);
    stub(ax - s.ux * 10, ay - s.uy * 10, s.ux, s.uy, s.len * 0.35 * Math.exp(-10 * k) + 10 * Math.exp(-4 * k), 16, 0, out);
    const fy = s.fy + 0.5 * G * k * k; // the drop left on the fingertip falls…
    if (fy < 1200) {
      out.push(ellipse(s.fx, fy, 7, 8 + Math.min(k * 25, 5)));
      stub(s.fx, fy, -s.ux, -s.uy, s.len * 0.3 * Math.exp(-12 * k), 12, 0, out); // …its tail snapping back into it
    } else if (k > 0.6) {
      snaps.splice(i, 1);
    }
  }
}

stage.addEventListener('pointermove', e => {
  const pt = trackFinger(e);
  if (grabbed) {
    const dx = pt.x - start[0], dy = pt.y - start[1];
    const give = 1 / (1 + Math.hypot(dx, dy) / (grabbed === dot ? 600 : 420)); // the further, the harder
    grabbed.gx = dx * give;
    grabbed.gy = dy * give;
    return;
  }
  const under = bodyAt(pt.x, pt.y);
  if (stuck && under === stuck.body) [stuck.lx, stuck.ly] = toLocal(under, pt.x, pt.y); // slides along the surface
  else if (!stuck && under) stickTo(under, pt.x, pt.y);
  if (stuck) followFinger(stuck);
  curiosity();
});

stage.addEventListener('pointerdown', e => {
  const pt = trackFinger(e);
  press = { x: pt.x, y: pt.y, t: performance.now() };
  stage.setPointerCapture(e.pointerId);
  const under = bodyAt(pt.x, pt.y) || stuck?.body; // grab what's under you, or what's stuck to you
  if (!under) return;
  if (stuck?.body !== under) { letGo(); stickTo(under, pt.x, pt.y); }
  grabbed = under;
  start = [pt.x - grabbed.gx, pt.y - grabbed.gy];
  document.body.classList.add('dragging');
});

function release(e) {
  const click = press && Math.hypot(finger.x - press.x, finger.y - press.y) < 6 && performance.now() - press.t < 300;
  press = null;
  if (grabbed) {
    grabbed.gx = grabbed.gy = 0;
    grabbed = null;
    document.body.classList.remove('dragging');
  }
  const touch = e.pointerType === 'touch';
  if (stuck) {
    if (touch || !isOn(stuck.body, finger.x, finger.y)) letGo();
    else followFinger(stuck); // still resting on it: back to leaning after the fingertip
  }
  if (touch) finger.x = finger.y = -1e4; // no hovering on touch screens
  if (click) startPop();
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('pointerleave', () => {
  if (grabbed) return;
  letGo();
  finger.x = finger.y = -1e4;
  curiosity();
});

window.sticky = { pop: startPop };

render();
requestAnimationFrame(frame);
</script>
</body>
</html>
