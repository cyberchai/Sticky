<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>sticky — text your footage</title>
  <meta name="description" content="Scan, add your number, text Sticky your footage, get a reel back." />
  <meta name="theme-color" content="#FDFB04" />
  <link rel="icon" href="/assets/sticky-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --yellow: #FDFB04; --ink: #361118; --ink-2: rgba(54, 17, 24, .6); --warn: #A23B1B; --taffy: cubic-bezier(.34, 1.56, .64, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--yellow); color: var(--ink); -webkit-font-smoothing: antialiased;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    a { color: inherit; }
    button { font: inherit; cursor: pointer; border: 0; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    main { height: 100%; display: grid; justify-items: center; padding: clamp(16px, 4vh, 44px) 16px; }
    .mark img { display: block; height: clamp(26px, 4.5vh, 44px); width: auto; }
    .hint { font-size: clamp(13px, 1.8vh, 17px); font-weight: 500; color: var(--ink-2); text-align: center; }

    /* Laptop: the QR is the page. Its light colour is the page colour, so the page is its quiet zone. */
    .desk { grid-template-rows: auto minmax(0, 1fr) auto; gap: clamp(12px, 3vh, 32px); }
    .fit { width: 100%; min-height: 0; container-type: size; display: grid; place-items: center; }
    .qr { display: block; width: min(100cqw, 100cqh); height: auto; aspect-ratio: 1; image-rendering: pixelated; }
    .foot { display: grid; justify-items: center; gap: clamp(8px, 1.4vh, 14px); }
    .title { font-size: clamp(18px, 3vh, 30px); font-weight: 700; text-align: center; overflow-wrap: anywhere; }
    .count { font-size: clamp(13px, 1.8vh, 17px); font-weight: 700; font-variant-numeric: tabular-nums; min-height: 1.4em; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px;
      border: 2px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700; font-size: 14px;
      transition: transform .35s var(--taffy), background-color .15s, color .15s;
    }
    .pill:hover { background: var(--ink); color: var(--yellow); }
    .pill:active { transform: scale(.96); }
    .pill.solid { background: var(--ink); color: var(--yellow); }
    .pill[disabled] { opacity: .5; pointer-events: none; }
    .newgroup { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: auto; }
    .newgroup input { width: min(260px, 70vw); padding: 9px 14px; font-size: 15px; border-radius: 999px; text-align: left; }
    /* Host only: the joiners' numbers, to add them to a group chat by hand when Sticky can't. */
    .byhand { display: grid; justify-items: center; gap: 8px; width: min(560px, 92vw); }
    .byhand summary { list-style: none; }
    .byhand summary::-webkit-details-marker { display: none; }
    .byhand ol {
      list-style: none; width: 100%; columns: 3 150px; column-gap: 16px; max-height: 18vh; overflow: auto;
      font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: left;
    }
    .byhand li { break-inside: avoid; padding: 2px 0; }
    .byhand li small { color: var(--ink-2); }

    /* Phone: you can't scan your own screen, so it's just the number. */
    .phone { display: none; align-content: center; gap: 22px; }
    .phone .mark img { height: 64px; }
    .lead { font-size: 20px; font-weight: 700; text-align: center; max-width: 340px; overflow-wrap: anywhere; }
    form { display: grid; gap: 10px; width: min(340px, 100%); }
    input {
      width: 100%; border: 2px solid var(--ink); border-radius: 16px; padding: 16px 18px; background: #fff;
      font: inherit; font-size: 19px; color: var(--ink); text-align: center; font-variant-numeric: tabular-nums;
    }
    input:focus { outline: none; box-shadow: 0 0 0 4px rgba(54, 17, 24, .15); }
    .btn {
      display: flex; align-items: center; justify-content: center; padding: 17px; border-radius: 16px;
      background: var(--ink); color: var(--yellow); font-weight: 700; font-size: 17px; text-decoration: none;
      transition: transform .35s var(--taffy);
    }
    .btn:active { transform: scale(.97); }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .done { display: none; gap: 10px; width: min(340px, 100%); text-align: center; animation: pop .5s var(--taffy); }
    .msg { min-height: 1.4em; font-size: 14px; text-align: center; }
    .msg.err { color: var(--warn); font-weight: 700; }
    .is-done form { display: none; }
    .is-done .done { display: grid; }
    @keyframes pop { from { transform: scale(.94); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .done { animation: none; } .btn, .pill { transition: none; } }

    @media (hover: none), (pointer: coarse) {
      .desk { display: none; }
      .phone { display: grid; }
    }
  </style>
</head>
<body>
  <h1 class="sr">Join sticky</h1>

  <main class="desk">
    <a class="mark" href="/" aria-label="sticky home"><img src="/assets/sticky-mark.svg" alt="sticky" width="66" height="30" /></a>
    <div class="fit"><img class="qr" id="qr" alt="QR code: open this page on your phone" width="640" height="640" /></div>
    <div class="foot">
      <p class="title" id="title" hidden></p>
      <p class="hint" id="hint">Scan with your phone</p>
      <p class="count" id="count" role="status" aria-live="polite" hidden></p>
      <details class="byhand" id="byHand" hidden>
        <summary class="pill" id="byHandSum">Add by hand</summary>
        <p class="hint" id="byHandHint"></p>
        <ol id="byHandList"></ol>
        <button class="pill solid" id="copyNums" type="button">Copy numbers</button>
      </details>
      <button class="pill" id="newGroup" type="button">+ New group chat</button>
      <form class="newgroup" id="groupForm" hidden>
        <input id="groupName" maxlength="40" autocomplete="off" placeholder="Name it (optional)" aria-label="Group chat name" />
        <button class="pill solid" id="groupGo" type="submit">Create</button>
      </form>
      <p class="msg" id="deskMsg" role="status" aria-live="polite"></p>
    </div>
  </main>

  <main class="phone" id="phone">
    <a class="mark" href="/" aria-label="sticky home"><img src="/assets/sticky-mark.svg" alt="sticky" width="140" height="64" /></a>
    <p class="lead" id="lead" hidden></p>
    <form id="form" autocomplete="on">
      <input id="num" type="tel" inputmode="tel" autocomplete="tel" placeholder="Your number" aria-label="Your phone number" required />
      <button class="btn" id="go" type="submit">Add me</button>
    </form>
    <div class="done">
      <a class="btn" id="smsBtn" href="#">Text Sticky</a>
      <p class="hint" id="doneHint">Then send it any clip.</p>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </main>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const desk = !matchMedia('(hover: none), (pointer: coarse)').matches;
    let code = (/^\/join\/g\/([A-HJ-NP-Z2-9]{8})\/?$/.exec(location.pathname) || [])[1] || null;
    let pollTimer = null;

    // ---- Group mode: the QR, the phone's labels, and (on the laptop) a live count. ----
    function countLine(g) {
      let head = 'Nobody in yet';
      if (g.started) head = `${g.inChat} in the group chat`;
      else if (g.texted) head = `${g.texted} in · the group chat starts when the second person joins`;
      const onTheWay = g.signedUp - g.texted;
      return onTheWay > 0 ? `${head} · ${onTheWay} on the way` : head;
    }
    async function refresh() {
      clearTimeout(pollTimer);
      if (!code) return;
      try {
        const res = await fetch(`/web/groups/${code}`, { cache: 'no-store' });
        const g = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(g.error || 'That group link doesn’t work.');
        showGroup(g.name);
        $('count').hidden = false;
        $('count').textContent = countLine(g);
        await refreshPeople().catch(() => {});
      } catch (err) {
        $('qr').hidden = true; $('title').hidden = true; $('count').hidden = true;
        $('hint').textContent = err.message;
        $('lead').hidden = true; $('go').disabled = true;
        $('msg').className = 'msg err'; $('msg').textContent = err.message;
        return;
      }
      if (desk) pollTimer = setTimeout(refresh, document.hidden ? 15000 : 4000);
    }
    function showGroup(name) {
      document.title = `Join ${name} — sticky`;
      $('qr').hidden = false;
      $('qr').src = `/join/g/${code}/qr.png`;
      $('qr').alt = `QR code: join the ${name} group chat`;
      $('title').hidden = false; $('title').textContent = name;
      $('hint').textContent = desk ? `Scan to join, or text Sticky “Join group ${code}”` : 'Scan to join the group chat';
      $('lead').hidden = false; $('lead').textContent = `Join “${name}”`;
      $('go').textContent = 'Join the group chat';
      $('smsBtn').textContent = 'Send the join text';
      $('doneHint').textContent = 'Send it and you’re in the group chat.';
    }
    // ---- Host only: the fallback list. The key came back when this laptop made the group. ----
    const hostSlot = (c) => `sticky.groupHost.${c}`;
    let hostKey = null;
    try { hostKey = code && localStorage.getItem(hostSlot(code)); } catch { /* private mode: this tab only */ }
    let copyText = '';
    const pretty = (e164) => {
      const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(e164);
      return m ? `(${m[1]}) ${m[2]}-${m[3]}` : e164;
    };
    function personItem(label, note) {
      const li = document.createElement('li');
      li.textContent = label;
      if (note) { const s = document.createElement('small'); s.textContent = ` · ${note}`; li.append(s); }
      return li;
    }
    async function refreshPeople() {
      if (!desk || !code || !hostKey) return;
      const res = await fetch(`/web/groups/${code}/people`, { cache: 'no-store', headers: { 'X-Sticky-Host': hostKey } });
      if (!res.ok) { $('byHand').hidden = true; return; }
      const r = await res.json();
      const todo = r.people.filter((p) => !p.inChat);
      $('byHand').hidden = false;
      $('byHandSum').textContent = todo.length ? `Add by hand · ${todo.length}` : 'Add by hand';
      $('byHandHint').textContent = r.started
        ? (todo.length ? 'Sticky couldn’t add these people. Add them to the group chat from your phone.' : 'Everyone who joined is in the group chat.')
        : 'Sticky starts the group chat itself once two people are in. If it doesn’t, start an iMessage group with Sticky and these numbers.';
      const items = todo.map((p) => personItem(pretty(p.phone), p.texted ? '' : 'no join text yet'));
      if (!r.started && todo.length) items.unshift(personItem(`Sticky ${pretty(r.line)}`));
      $('byHandList').replaceChildren(...items);
      copyText = [...(r.started ? [] : [r.line]), ...todo.map((p) => p.phone)].join(', ');
      $('copyNums').hidden = !todo.length;
    }
    $('copyNums').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(copyText);
        $('copyNums').textContent = 'Copied';
        setTimeout(() => { $('copyNums').textContent = 'Copy numbers'; }, 1500);
      } catch {
        $('deskMsg').className = 'msg'; $('deskMsg').textContent = copyText;
      }
    });

    if (code) refresh(); else $('qr').src = '/join/qr.png';
    document.addEventListener('visibilitychange', () => { if (!document.hidden && code && desk) refresh(); });

    // ---- Laptop: start a new group chat. ----
    $('newGroup').addEventListener('click', () => {
      $('newGroup').hidden = true; $('groupForm').hidden = false; $('groupName').focus();
    });
    $('groupName').addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { $('groupForm').hidden = true; $('newGroup').hidden = false; }
    });
    $('groupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('groupGo').disabled = true; $('deskMsg').className = 'msg'; $('deskMsg').textContent = '';
      try {
        const res = await fetch('/web/groups', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('groupName').value }) });
        const g = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(g.error || 'Couldn’t start a group. Try again?');
        code = g.code;
        hostKey = g.hostKey;
        try { localStorage.setItem(hostSlot(code), hostKey); } catch { /* kept for this tab only */ }
        history.pushState(null, '', `/join/g/${code}`);
        $('groupName').value = ''; $('groupForm').hidden = true; $('newGroup').hidden = false;
        showGroup(g.name);
        refresh();
      } catch (err) {
        $('deskMsg').className = 'msg err'; $('deskMsg').textContent = err.message;
      } finally {
        $('groupGo').disabled = false;
      }
    });
    addEventListener('popstate', () => location.reload());

    // ---- Phone: add the number, then the first text (in a group, it says which one). ----
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = $('num').value.trim();
      if (!phone) return;
      $('go').disabled = true; $('msg').className = 'msg'; $('msg').textContent = '';
      try {
        const res = await fetch('/web/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(code ? { phone, group: code } : { phone }) });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || 'Something went wrong.');
        if (body.sms) $('smsBtn').href = body.sms;
        $('phone').classList.add('is-done');
        // Straight into Messages with the text ready; the button stays for a browser that blocks this.
        if (code && body.sms) location.href = body.sms;
      } catch (err) {
        $('msg').className = 'msg err'; $('msg').textContent = err.message;
      } finally {
        $('go').disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
