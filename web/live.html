<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>sticky live</title>
  <meta name="theme-color" content="#361118" />
  <link rel="icon" href="/assets/sticky.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,800;1,900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #FDFB04;
      --ink: #361118;
      --ink-deep: #240b10;
      --ink-2: rgba(54, 17, 24, 0.72);
      --ink-3: rgba(54, 17, 24, 0.5);
      --line: rgba(54, 17, 24, 0.12);
      --on-ink: #FFFEF0;
      --on-ink-2: rgba(255, 254, 240, 0.7);
      --on-ink-3: rgba(255, 254, 240, 0.45);
      --on-ink-line: rgba(255, 254, 240, 0.14);
      --card: #FFFFFF;
      --cream: #FFFEF0;
      --ok: #1F7A4D;
      --warn: #A23B1B;
      --r-lg: 22px;
      --r-md: 14px;
      --r-sm: 10px;
      --taffy: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --display: "Playfair Display", "Times New Roman", serif;
      --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: var(--ui); background: var(--yellow); color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    body.in-room { background: var(--ink-deep); color: var(--on-ink); }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    .hidden { display: none !important; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 2px solid var(--ink); background: #fff; color: var(--ink); transition: transform .3s var(--taffy), background .2s; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }
    .btn.primary { background: var(--ink); color: var(--yellow); }
    .btn.yellow { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
    .btn.ghost { background: transparent; color: var(--on-ink); border-color: var(--on-ink-line); }
    .btn.small { padding: 7px 12px; font-size: 13px; }
    .field { width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 2px solid var(--line); background: #fff; font-size: 15px; outline: none; transition: border-color .2s; }
    .field:focus { border-color: var(--ink); }

    /* ---------- join ---------- */
    .join-view { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .join-card { width: min(460px, 100%); background: #fff; border: 2px solid var(--ink); border-radius: 30px; padding: 26px 24px 24px; box-shadow: 0 28px 60px -32px rgba(54, 17, 24, .45); display: grid; gap: 14px; }
    .join-card .mark { height: 28px; }
    .join-card h1 { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 34px; line-height: 1.05; }
    .join-card p { color: var(--ink-2); font-size: 14px; }
    .join-card p:empty { display: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .preview { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-lg); overflow: hidden; background: var(--ink); display: grid; place-items: center; color: var(--on-ink-2); font-size: 13px; text-align: center; padding: 12px; }
    .preview video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .join-card label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    .toggles { display: flex; gap: 8px; }
    .join-card label.toggle, .toggle { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; cursor: pointer; }
    .err { color: var(--warn); font-size: 13px; font-weight: 600; min-height: 1em; }

    /* ---------- room ---------- */
    .room { min-height: 100vh; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--on-ink-line); }
    .bar .mark { height: 24px; filter: invert(1) brightness(1.6); }
    .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .ttl b { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .08em; background: #E4572E; color: #fff; display: inline-flex; align-items: center; gap: 6px; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
    .role { display: none; }
    @keyframes pulse { 50% { opacity: .3 } }
    .avatars { display: flex; }
    .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; border: 2px solid var(--ink-deep); margin-left: -6px; }
    .conn { font-size: 12px; color: var(--on-ink-3); }

    .grid { flex: 1; display: grid; grid-template-columns: auto minmax(220px, 300px) minmax(300px, 1fr); gap: 16px; padding: 16px 18px 18px; min-height: 0; }
    .stage-col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .stage { position: relative; height: min(calc(100vh - 210px), 780px); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 2px var(--on-ink-line); touch-action: none; }
    .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .stage-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--on-ink-2); font-size: 14px; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .cursor { position: absolute; transform: translate(-50%, -50%); }
    .cursor i { display: block; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--c); background: color-mix(in srgb, var(--c) 30%, transparent); box-shadow: 0 0 0 2px rgba(0,0,0,.35); transition: transform .15s; }
    .cursor.pointing i { transform: scale(1.25); background: var(--c); }
    .cursor span { position: absolute; left: 16px; top: 14px; background: var(--c); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; max-width: 60%; }
    .pin .tag { background: var(--yellow); color: var(--ink); font-size: 12px; font-weight: 700; padding: 6px 9px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.35); line-height: 1.3; text-align: left; }
    .pin .tag small { display: block; font-weight: 600; color: var(--ink-2); font-size: 11px; }
    .pin .stem { width: 2px; height: 12px; background: var(--yellow); }
    .pin .spot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--yellow); background: rgba(0,0,0,.25); transform: translateY(8px); animation: ring 1.4s ease-out infinite; }
    .pin.mine .tag { background: #fff; }
    .pin.note .tag { background: var(--cream); }
    @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(253,251,4,.7) } 100% { box-shadow: 0 0 0 16px rgba(253,251,4,0) } }
    .transport { display: flex; align-items: center; gap: 10px; width: 100%; }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--yellow); color: var(--ink); font-weight: 900; display: grid; place-items: center; flex: none; }
    .clock { font-size: 12px; color: var(--on-ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .scrub { position: relative; flex: 1; height: 28px; border-radius: 8px; background: rgba(255,254,240,.08); cursor: pointer; overflow: hidden; }
    .scrub .shot { position: absolute; top: 0; bottom: 0; border-right: 1px solid rgba(255,254,240,.25); font-size: 9px; color: var(--on-ink-3); padding: 2px 4px; overflow: hidden; }
    .scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(253,251,4,.22); pointer-events: none; }
    .scrub .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--yellow); pointer-events: none; }
    .scrub .tick { position: absolute; bottom: 2px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 2px var(--ink-deep); }
    .vrail { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .vtab { padding: 6px 11px; border-radius: 999px; border: 1.5px solid var(--on-ink-line); font-size: 12px; font-weight: 700; color: var(--on-ink-2); }
    .vtab[aria-selected="true"] { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }

    .people-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .tiles { display: grid; gap: 10px; align-content: start; }
    .tile { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: #1a0709; box-shadow: 0 0 0 2px var(--c, transparent); }
    .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tile.me video, .tile.me canvas { transform: scaleX(-1); }
    .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .tile .initials { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: var(--on-ink-3); }
    .tile .who { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
    .tile .who .nm { background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .who .hand { margin-left: auto; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 999px; font-weight: 600; color: var(--on-ink-2); white-space: nowrap; }
    .tile .cap { position: absolute; left: 8px; right: 8px; top: 8px; font-size: 12px; background: rgba(0,0,0,.6); padding: 5px 8px; border-radius: 10px; opacity: 0; transition: opacity .3s; }
    .tile .cap.on { opacity: 1; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }
    .ctl { padding: 8px 12px; border-radius: 999px; background: rgba(255,254,240,.1); font-size: 12px; font-weight: 700; }
    .ctl.off { background: #A23B1B; }
    .ctl.listen { background: var(--yellow); color: var(--ink); }
    .ctl.listen.hot { animation: hot 1s ease-in-out infinite; }
    @keyframes hot { 50% { box-shadow: 0 0 0 6px rgba(253,251,4,.25) } }
    .hint { font-size: 12px; color: var(--on-ink-2); }
    .hint b { color: var(--yellow); font-weight: 700; }

    .side-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--cream); color: var(--ink); border-radius: 22px; overflow: hidden; max-height: calc(100vh - 92px); }
    .tabs { display: flex; gap: 4px; padding: 10px 10px 0; }
    .tabs button { padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .tabs button[aria-selected="true"] { background: var(--ink); color: var(--yellow); }
    .tabs .count { font-size: 11px; opacity: .7; margin-left: 4px; }
    .tab { flex: 1; overflow-y: auto; padding: 10px 14px; min-height: 160px; }
    .feed { display: grid; gap: 8px; }
    .ev { font-size: 13px; line-height: 1.4; }
    .ev.sys { color: var(--ink-3); font-size: 12px; }
    .ev .who { font-weight: 700; }
    .ev.said { color: var(--ink-2); }
    .ev.cmd { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 10px; }
    .ev.sticky { background: var(--yellow); border-radius: 14px; padding: 8px 10px; white-space: pre-wrap; }
    .ev.sticky .who::before { content: "sticky · "; }
    .ev .where { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .item { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 4px; font-size: 13px; }
    .item:first-child { border-top: 0; }
    .item .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .item .vno { font-weight: 800; font-size: 15px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(54,17,24,.07); }
    .chip.live { background: #E4572E; color: #fff; }
    .chip.ok { background: var(--ok); color: #fff; }
    .chip.bad { background: var(--warn); color: #fff; }
    .chip.yl { background: var(--yellow); }
    .item .said { font-weight: 600; }
    .item .muted { color: var(--ink-2); font-size: 12px; }
    .item button.link { text-decoration: underline; text-underline-offset: 3px; font-weight: 700; font-size: 12px; justify-self: start; }
    .mention { font-weight: 700; background: rgba(253,251,4,.6); border-radius: 4px; padding: 0 2px; }
    .composer { position: relative; display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: #fff; }
    .composer .field { padding: 10px 12px; font-size: 14px; }
    .pinned { position: absolute; left: 10px; bottom: calc(100% + 6px); background: var(--ink); color: var(--yellow); font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; display: flex; gap: 8px; align-items: center; }
    .pinned button { color: var(--on-ink-2); font-weight: 800; }
    .mention-pop { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 6px); background: #fff; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px -20px rgba(0,0,0,.5); }
    .mention-pop button { display: flex; width: 100%; text-align: left; padding: 9px 12px; font-size: 13px; gap: 8px; }
    .mention-pop button[aria-selected="true"], .mention-pop button:hover { background: var(--yellow); }
    .mention-pop small { color: var(--ink-2); margin-left: auto; }

    .pop { position: fixed; right: 18px; top: 64px; width: min(380px, calc(100vw - 32px)); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 22px; padding: 18px; box-shadow: 0 28px 60px -24px rgba(0,0,0,.6); display: grid; gap: 12px; z-index: 20; max-height: calc(100vh - 90px); overflow-y: auto; }
    .pop h3 { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 22px; }
    .pop .sub { font-size: 13px; color: var(--ink-2); }
    .pop .row { display: flex; gap: 8px; }
    .pop .person { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
    .pop .person:first-child { border-top: 0; }
    .pop .person .nm { flex: 1; font-weight: 600; }
    .pop .close { position: absolute; right: 14px; top: 12px; font-size: 20px; font-weight: 700; color: var(--ink-2); }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--yellow); color: var(--ink); padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; pointer-events: none; transition: opacity .3s var(--ease), transform .45s var(--taffy); max-width: calc(100vw - 32px); text-align: center; z-index: 30; box-shadow: 0 18px 40px -16px rgba(0,0,0,.6); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1180px) {
      .grid { grid-template-columns: auto minmax(300px, 1fr); }
      .people-col { grid-column: 1 / -1; grid-row: 1; }
      .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; padding: 12px 16px; }
      .stage { height: auto; width: min(100%, 420px); }
      .side-col { max-height: none; }
      .bar { flex-wrap: wrap; padding: 10px 16px; }
      .ttl b { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <!-- ================= join ================= -->
  <div class="join-view" id="joinView">
    <div class="join-card">
      <img class="mark" src="/assets/sticky-mark.svg" alt="sticky" />
      <h1 id="joinTitle">Edit this reel live</h1>
      <p id="joinSub"></p>
      <div class="preview" id="preview"><span id="previewMsg"></span><video id="joinCam" muted playsinline autoplay></video></div>
      <label><span class="sr">Your name</span><input class="field" id="nameIn" maxlength="40" autocomplete="name" placeholder="Your name" /></label>
      <label id="phoneWrap"><span class="sr" id="phoneLabel">Phone, optional</span><input class="field" id="phoneIn" type="tel" inputmode="tel" autocomplete="tel" placeholder="Phone (optional)" /></label>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="camOn" checked /> Camera</label>
        <label class="toggle"><input type="checkbox" id="micOn" checked /> Mic</label>
      </div>
      <button class="btn primary" id="joinBtn" type="button">Join</button>
      <div class="err" id="joinErr" role="alert"></div>
    </div>
  </div>

  <!-- ================= room ================= -->
  <div class="room hidden" id="roomView">
    <header class="bar">
      <img class="mark" src="/assets/sticky-mark.svg" alt="sticky" />
      <div class="ttl"><b id="title">Your reel</b><span class="badge">LIVE</span><span class="role" id="roleTag"></span></div>
      <span class="conn" id="conn"></span>
      <div class="avatars" id="avatars"></div>
      <button class="btn ghost small" id="inviteBtn" type="button">Invite</button>
      <button class="btn yellow small hidden" id="finishBtn" type="button">Finish</button>
    </header>

    <div class="grid">
      <section class="stage-col" aria-label="The reel">
        <div class="stage" id="stage">
          <video id="reel" playsinline loop preload="auto"></video>
          <div class="stage-empty" id="stageEmpty">Waiting for the first cut…</div>
          <div class="layer" id="layer"></div>
        </div>
        <div class="transport">
          <button class="icon-btn" id="playBtn" type="button" aria-label="Play">▶</button>
          <div class="scrub" id="scrub" aria-label="Timeline"><div id="shots"></div><div class="fill" id="fill"></div><div id="ticks"></div><div class="head" id="head"></div></div>
          <span class="clock" id="clock">0:00 / 0:00</span>
        </div>
        <div class="vrail" id="vrail" role="tablist" aria-label="Versions"></div>
      </section>

      <section class="people-col" aria-label="People">
        <div class="tiles" id="tiles">
          <div class="tile me" id="meTile">
            <video id="selfCam" muted playsinline autoplay></video>
            <canvas id="handCanvas"></canvas>
            <div class="initials" id="meInitials"></div>
            <div class="cap" id="meCap"></div>
            <div class="who"><span class="nm" id="meName">You</span><span class="hand" id="handState">Hand tracking off</span></div>
          </div>
        </div>
        <div class="controls">
          <button class="ctl" id="micBtn" type="button">Mic on</button>
          <button class="ctl" id="camBtn" type="button">Camera on</button>
          <button class="ctl listen" id="listenBtn" type="button">Sticky is listening</button>
        </div>
        <div class="hint">Point and say <b>“Sticky, add a dog here”</b></div>
      </section>

      <section class="side-col" aria-label="Room">
        <div class="tabs" role="tablist">
          <button type="button" data-tab="feed" aria-selected="true">Room</button>
          <button type="button" data-tab="history" aria-selected="false">History<span class="count" id="histCount"></span></button>
          <button type="button" data-tab="notes" aria-selected="false">Notes<span class="count" id="noteCount"></span></button>
        </div>
        <div class="tab" id="tab-feed"><div class="feed" id="feed" aria-live="polite"></div></div>
        <div class="tab hidden" id="tab-history"><div id="historyList"></div></div>
        <div class="tab hidden" id="tab-notes"><div id="notesList"></div></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="pinned hidden" id="pinnedChip"><span id="pinnedText"></span><button type="button" id="unpin" aria-label="Unpin">×</button></div>
          <div class="mention-pop hidden" id="mentionPop" role="listbox"></div>
          <input class="field" id="cmd" maxlength="500" placeholder="Ask Sticky, or “note: …”" aria-label="Ask Sticky or leave a note" />
          <button class="btn primary small" type="submit">Send</button>
        </form>
      </section>
    </div>
  </div>

  <div class="pop hidden" id="invitePop" role="dialog" aria-label="Invite">
    <button class="close" type="button" data-close>×</button>
    <h3>Invite</h3>
    <div class="row"><input class="field" id="guestLink" readonly /><button class="btn primary small" id="copyLink" type="button">Copy</button></div>
    <div class="sub" style="font-weight:700;color:var(--ink)">Your network</div>
    <div id="networkList"></div>
    <form class="hidden" id="contactForm" style="display:grid;gap:8px">
      <div class="row"><input class="field" id="contactName" placeholder="Name" maxlength="40" /><input class="field" id="contactPhone" type="tel" placeholder="Phone" /></div>
      <button class="btn small" type="submit">Add to network</button>
    </form>
  </div>

  <div class="pop hidden" id="finishPop" role="dialog" aria-label="Finish">
    <button class="close" type="button" data-close>×</button>
    <h3>Finish</h3>
    <div class="sub" id="finishSub"></div>
    <label id="finishPhoneWrap" class="hidden" style="display:grid;gap:6px;font-size:13px;font-weight:700">Your phone<input class="field" id="finishPhone" type="tel" placeholder="+1 555 123 4567" /></label>
    <button class="btn primary" id="finishGo" type="button">Text it to me</button>
    <div class="err" id="finishErr"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hex = (n) => Array.from(crypto.getRandomValues(new Uint8Array(n)), (b) => b.toString(16).padStart(2, '0')).join('');
    const fmt = (ms) => { const s = Math.max(0, Math.floor((ms || 0) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    const clamp = (n) => Math.max(0, Math.min(1, n));
    const initials = (name) => String(name || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
    const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3600); };

    // ---------- identity ----------
    const token = location.pathname.split('/').pop();
    // The host key arrives as #host=<key> (a fragment never reaches the server); older links used ?host=.
    // Either way it moves into storage and out of the address bar and history.
    const linkKey = /^#host=([a-f0-9]{32})$/.exec(location.hash)?.[1] || new URLSearchParams(location.search).get('host');
    if (linkKey) { store.set(`sticky.host.${token}`, linkKey); history.replaceState(null, '', location.pathname); }
    const hostKey = store.get(`sticky.host.${token}`) || '';
    let personId = store.get('sticky.person');
    if (!/^[a-f0-9]{32}$/.test(personId || '')) { personId = hex(16); store.set('sticky.person', personId); }
    const peerId = hex(16);
    const api = (p) => `/live-api/${token}${p}`;
    const headers = () => ({ 'Content-Type': 'application/json', ...(hostKey ? { 'X-Sticky-Host': hostKey } : {}) });
    const post = async (p, body) => {
      try {
        const r = await fetch(api(p), { method: 'POST', headers: headers(), body: JSON.stringify(body) });
        return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) };
      } catch { return { ok: false, status: 0, body: { error: 'network' } }; }
    };

    const WAKE = /\b(?:hey|hi|ok|okay)?[\s,]*(?:sticky|stickie|sticki|stikky|stickey)\b[\s,.:;!?-]*(.*)$/i;
    // Same pattern as NOTE in src/live.ts.
    const NOTE = /^(?:(?:add|leave|make|take|drop)\s+(?:a\s+)?)?note\b[\s,.:;-]*|^tag\b[\s,.:;-]*/i;
    const DEICTIC = /\b(here|there|this|that|these|those)\b/i;
    const STAGES = { load: 'Loading the clips', gemini: 'Gemini is deciding the edit', omni: 'Gemini Omni is editing the footage (about a minute)', generate: 'Veo is generating the shot', music: 'Lyria is scoring', render: 'Cutting', probe: 'Checking the export', store: 'Saving', deliver: 'Showing it to the room' };

    // ---------- state ----------
    let S = null;            // server state
    let me = null;           // {peer, handle, name, role, color}
    let viewVersion = null;  // version number on the stage
    let knownLatest = 0;
    let stateTimer = null;

    async function loadState() {
      try {
        const r = await fetch(api('/state'), { headers: headers(), cache: 'no-store' });
        if (r.status === 404) { $('joinTitle').textContent = 'This link isn’t valid'; $('joinSub').textContent = 'Ask the host for a fresh link.'; $('joinBtn').disabled = true; return; }
        if (!r.ok) return;
        S = await r.json();
        onState();
      } catch {}
    }
    const refresh = () => { clearTimeout(stateTimer); stateTimer = setTimeout(loadState, 150); };

    function onState() {
      document.title = `${S.project.title} · sticky live`;
      $('title').textContent = S.project.title;
      $('joinTitle').textContent = `Edit “${S.project.title}” live`;
      const latest = S.versions.length ? S.versions[S.versions.length - 1].versionNo : null;
      if (latest && latest > knownLatest) {
        if (knownLatest) toast(`v${latest} is ready`);
        knownLatest = latest;
        setVersion(latest);
      } else if (!viewVersion && latest) setVersion(latest);
      renderRail(); renderHistory(); renderNotes(); renderAvatars(); renderHostBits(); renderTimeline();
    }

    // ---------- join ----------
    let local = null;
    const camWanted = () => $('camOn').checked;
    const micWanted = () => $('micOn').checked;
    async function getMedia() {
      if (!navigator.mediaDevices?.getUserMedia || (!camWanted() && !micWanted())) return null;
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: camWanted() ? { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } : false,
          audio: micWanted() ? { echoCancellation: true, noiseSuppression: true } : false,
        });
      } catch { return null; }
    }
    async function preview() {
      local?.getTracks().forEach((t) => t.stop());
      local = await getMedia();
      $('joinCam').srcObject = local;
      $('previewMsg').textContent = local?.getVideoTracks().length ? '' : (camWanted() ? 'Camera blocked · point with your mouse' : 'Camera off');
    }
    $('camOn').addEventListener('change', preview);
    $('micOn').addEventListener('change', preview);
    $('nameIn').value = store.get('sticky.name') || '';

    function renderJoin() {
      if (!S) return;
      const host = S.role === 'host';
      if (host && S.project.origin === 'web' && !S.host.phoneOnFile) {
        $('phoneLabel').textContent = 'Your phone, to text you the final reel';
        $('phoneIn').placeholder = 'Phone, for the final reel';
      } else if (host) {
        $('phoneWrap').classList.add('hidden');
      }
      $('joinBtn').textContent = host ? 'Start' : 'Join';
    }

    $('joinBtn').addEventListener('click', async () => {
      const name = $('nameIn').value.trim();
      if (!name) { $('joinErr').textContent = 'Add your name so the room knows who’s talking.'; $('nameIn').focus(); return; }
      $('joinBtn').disabled = true;
      const r = await post('/join', { person: personId, name, phone: $('phoneIn').value.trim() || undefined });
      $('joinBtn').disabled = false;
      if (!r.ok) { $('joinErr').textContent = r.body.error || 'Couldn’t join. Try again.'; return; }
      store.set('sticky.name', name);
      enterRoom(name);
    });
    $('nameIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });

    async function enterRoom(name) {
      $('joinView').classList.add('hidden');
      $('roomView').classList.remove('hidden');
      document.body.classList.add('in-room');
      $('meName').textContent = `${name} (you)`;
      $('meInitials').textContent = initials(name);
      if (!local) local = await getMedia();
      $('selfCam').srcObject = local;
      $('meInitials').classList.toggle('hidden', Boolean(local?.getVideoTracks().length));
      $('micBtn').classList.toggle('hidden', !local?.getAudioTracks().length);
      $('camBtn').classList.toggle('hidden', !local?.getVideoTracks().length);
      await loadState();
      connect();
      startHands();
      startListening();
      requestAnimationFrame(drawLoop);
      setInterval(loadState, 20_000);
    }

    // ---------- realtime ----------
    // Server-sent events read with fetch, not EventSource, so the host key and person id ride in headers
    // instead of the URL. Reconnects resume from the last event id (the server replays what was missed).
    let lastEventId = 0;
    async function connect() {
      for (;;) {
        try {
          const res = await fetch(api(`/stream?peer=${peerId}`), {
            cache: 'no-store',
            headers: { ...headers(), 'X-Sticky-Person': personId, ...(lastEventId ? { 'Last-Event-ID': String(lastEventId) } : {}) },
          });
          if (!res.ok || !res.body) throw new Error(`stream HTTP ${res.status}`);
          $('conn').textContent = '';
          const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
          let buf = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += value;
            let end;
            while ((end = buf.indexOf('\n\n')) >= 0) {
              const block = buf.slice(0, end);
              buf = buf.slice(end + 2);
              let data = '';
              for (const line of block.split('\n')) {
                if (line.startsWith('id: ')) lastEventId = Number(line.slice(4)) || lastEventId;
                else if (line.startsWith('data: ')) data += line.slice(6);
              }
              if (data) { try { onEvent(JSON.parse(data)); } catch (err) { console.warn('[live] bad event', err); } }
            }
          }
        } catch (err) {
          console.warn('[live] stream', err);
        }
        $('conn').textContent = 'Reconnecting…';
        await new Promise((r) => setTimeout(r, 2000));
      }
    }
    addEventListener('pagehide', () => { navigator.sendBeacon?.(api('/leave'), JSON.stringify({ peer: peerId })); });
    const signal = (to, data) => post('/signal', { from: peerId, to, data });

    function onEvent(m) {
      const p = m.payload || {};
      switch (m.type) {
        case 'hello': {
          // Also sent on every reconnect: only call peers we don't already have, or live calls would reset.
          const first = !me;
          me = p.you;
          $('meTile').style.setProperty('--c', me.color);
          $('roleTag').textContent = me.role === 'host' ? 'You’re the host' : '';
          for (const o of p.others) {
            const known = peers.has(o.peer);
            addPeer(o);
            if (!known && peerId < o.peer) call(o.peer);
          }
          if (first) feed({ kind: 'sys', text: p.others.length ? `You joined ${p.others.map((o) => o.name).join(', ')}.` : 'You’re the first one here. Invite people with the Invite button.' });
          break;
        }
        case 'join':
          addPeer(p);
          if (peerId < p.peer) call(p.peer);
          feed({ kind: 'sys', text: `${p.name} joined.` });
          refresh();
          break;
        case 'leave': {
          const peer = peers.get(p.peer);
          if (peer) feed({ kind: 'sys', text: `${peer.info.name} left.` });
          removePeer(p.peer);
          refresh();
          break;
        }
        case 'signal': queueSignal(m.from, p); break;
        case 'heard':
          feed({ kind: 'cmd', who: p.name, color: colorOfHandle(p.handle), text: p.text, anchor: p.anchor });
          if (p.anchor) tempPins.set(p.reqId || hex(4), { ...p.anchor, said: p.text, name: p.name, at: Date.now() });
          break;
        case 'grounding': feed({ kind: 'sys', text: 'Sticky is looking at the spot…' }); break;
        case 'sticky':
          feed({ kind: 'sticky', text: p.text });
          if (/^v\d+ is ready|^Texted/.test(p.text)) toast(p.text.split('.')[0]);
          refresh();
          break;
        case 'note':
          if (p.body) feed({ kind: 'said', who: `${p.author} left a note`, color: colorOfHandle(p.handle), text: p.body });
          refresh();
          break;
        case 'network':
        case 'state': refresh(); break;
      }
    }

    // ---------- people + WebRTC (mesh; the smaller peer id always offers) ----------
    const peers = new Map();
    function colorOfHandle(handle) {
      if (me && handle === me.handle) return me.color;
      for (const p of peers.values()) if (p.info.handle === handle) return p.info.color;
      return '#888';
    }
    function addPeer(info) {
      if (info.peer === peerId) return;
      let p = peers.get(info.peer);
      if (p) { p.info = { ...p.info, ...info }; p.tile.querySelector('.nm').textContent = info.name; return; }
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.setProperty('--c', info.color || '#888');
      tile.innerHTML = `<video playsinline autoplay></video><div class="initials">${esc(initials(info.name))}</div><div class="cap"></div><div class="who"><span class="nm">${esc(info.name)}</span><span class="hand hidden"></span></div>`;
      $('tiles').appendChild(tile);
      p = { info, tile, video: tile.querySelector('video'), pc: null, dc: null, pendingIce: [], chain: Promise.resolve(), cursor: null, capTimer: null };
      peers.set(info.peer, p);
      renderAvatars();
    }
    function removePeer(peer) {
      const p = peers.get(peer);
      if (!p) return;
      try { p.pc?.close(); } catch {}
      p.tile.remove();
      peers.delete(peer);
      renderAvatars();
    }
    function makePc(p) {
      try { p.pc?.close(); } catch {}
      const pc = new RTCPeerConnection({ iceServers: S?.iceServers || [{ urls: 'stun:stun.l.google.com:19302' }] });
      p.pc = pc;
      p.pendingIce = [];
      pc.onicecandidate = (e) => { if (e.candidate) signal(p.info.peer, { kind: 'ice', candidate: e.candidate.toJSON() }); };
      pc.ontrack = (e) => {
        const stream = e.streams[0] || new MediaStream([e.track]);
        if (p.video.srcObject !== stream) p.video.srcObject = stream;
        p.video.play().catch(() => {});
        if (e.track.kind === 'video') p.tile.querySelector('.initials').classList.add('hidden');
      };
      pc.ondatachannel = (e) => setupDc(p, e.channel);
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed' && peerId < p.info.peer && p.pc === pc) setTimeout(() => call(p.info.peer), 1000);
      };
      return pc;
    }
    async function call(peer) {
      const p = peers.get(peer);
      if (!p) return;
      const pc = makePc(p);
      if (local) for (const t of local.getTracks()) pc.addTrack(t, local);
      if (!local?.getVideoTracks().length) pc.addTransceiver('video', { direction: 'recvonly' });
      if (!local?.getAudioTracks().length) pc.addTransceiver('audio', { direction: 'recvonly' });
      setupDc(p, pc.createDataChannel('live'));
      await pc.setLocalDescription(await pc.createOffer());
      signal(peer, { kind: 'offer', sdp: pc.localDescription.toJSON() });
    }
    function queueSignal(from, d) {
      if (!peers.has(from)) {
        const known = S?.present?.find((x) => x.peer === from);
        addPeer(known || { peer: from, name: 'Someone', color: '#888' });
      }
      const p = peers.get(from);
      p.chain = p.chain.then(() => onSignal(p, d)).catch((err) => console.warn('[live] signal', err));
    }
    async function onSignal(p, d) {
      if (d.kind === 'offer') {
        const pc = makePc(p);
        await pc.setRemoteDescription(d.sdp);
        if (local) for (const t of local.getTracks()) pc.addTrack(t, local);
        await pc.setLocalDescription(await pc.createAnswer());
        signal(p.info.peer, { kind: 'answer', sdp: pc.localDescription.toJSON() });
        for (const c of p.pendingIce.splice(0)) await pc.addIceCandidate(c).catch(() => {});
      } else if (d.kind === 'answer') {
        if (p.pc?.signalingState === 'have-local-offer') {
          await p.pc.setRemoteDescription(d.sdp);
          for (const c of p.pendingIce.splice(0)) await p.pc.addIceCandidate(c).catch(() => {});
        }
      } else if (d.kind === 'ice') {
        if (p.pc?.remoteDescription) await p.pc.addIceCandidate(d.candidate).catch(() => {});
        else p.pendingIce.push(d.candidate);
      }
    }

    // Data channel: cursors, captions, shared playback.
    function setupDc(p, dc) {
      p.dc = dc;
      dc.onopen = () => sendView(p);
      dc.onmessage = (e) => { try { onDc(p, JSON.parse(e.data)); } catch {} };
    }
    function broadcast(msg) {
      const s = JSON.stringify(msg);
      for (const p of peers.values()) if (p.dc?.readyState === 'open') p.dc.send(s);
    }
    function onDc(p, m) {
      if (m.t === 'cursor') p.cursor = { ...m, seen: Date.now() };
      else if (m.t === 'cap') {
        showCap(p.tile.querySelector('.cap'), m.text, p);
        if (m.final && !WAKE.test(m.text)) feed({ kind: 'said', who: p.info.name, color: p.info.color, text: m.text });
      } else if (m.t === 'view') applyView(m);
    }
    function showCap(el, text, holder) {
      el.textContent = text;
      el.classList.add('on');
      clearTimeout(holder.capTimer);
      holder.capTimer = setTimeout(() => el.classList.remove('on'), 3500);
    }

    // ---------- the reel + shared playback ----------
    const reel = $('reel');
    let applyingRemote = false;
    const versionOf = (n) => S?.versions.find((v) => v.versionNo === n);
    function setVersion(n, keepTime = false) {
      const v = versionOf(n);
      if (!v) return;
      const t = keepTime ? reel.currentTime : 0;
      const wasPlaying = !reel.paused;
      viewVersion = n;
      if (reel.dataset.src !== v.url) {
        reel.dataset.src = v.url;
        reel.src = v.url;
        reel.addEventListener('loadedmetadata', () => { reel.currentTime = Math.min(t, reel.duration || 0); if (wasPlaying) reel.play().catch(() => {}); }, { once: true });
      }
      $('stageEmpty').classList.add('hidden');
      renderRail(); renderTimeline();
    }
    function sendView(target) {
      const msg = { t: 'view', v: viewVersion, time: reel.currentTime, playing: !reel.paused };
      if (!target) return broadcast(msg);
      if (target.dc?.readyState === 'open') target.dc.send(JSON.stringify(msg));
    }
    function applyView(m) {
      applyingRemote = true;
      if (m.v && m.v !== viewVersion && versionOf(m.v)) setVersion(m.v);
      if (Math.abs(reel.currentTime - m.time) > 0.35) reel.currentTime = m.time;
      if (m.playing && reel.paused) reel.play().catch(() => {});
      if (!m.playing && !reel.paused) reel.pause();
      clearTimeout(applyView.t);
      applyView.t = setTimeout(() => { applyingRemote = false; }, 400);
    }
    ['play', 'pause', 'seeked'].forEach((ev) => reel.addEventListener(ev, () => { $('playBtn').textContent = reel.paused ? '▶' : '❚❚'; if (!applyingRemote) sendView(); }));
    $('playBtn').addEventListener('click', () => { if (!viewVersion) return; reel.paused ? reel.play().catch(() => {}) : reel.pause(); });
    $('scrub').addEventListener('click', (e) => {
      if (!reel.duration) return;
      const r = $('scrub').getBoundingClientRect();
      reel.currentTime = clamp((e.clientX - r.left) / r.width) * reel.duration;
    });
    $('vrail').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; setVersion(Number(b.dataset.v), true); sendView(); });

    function renderRail() {
      if (!S) return;
      $('vrail').innerHTML = S.versions.map((v) => `<button class="vtab" role="tab" data-v="${v.versionNo}" aria-selected="${v.versionNo === viewVersion}">v${v.versionNo}${v.kept ? ' ★' : ''}</button>`).join('');
    }
    function renderTimeline() {
      const v = versionOf(viewVersion);
      if (!v) { $('shots').innerHTML = ''; $('ticks').innerHTML = ''; return; }
      const total = v.shots.reduce((a, s) => a + s.ms, 0) || v.durationMs || 1;
      let at = 0;
      $('shots').innerHTML = v.shots.map((s) => { const left = (at / total) * 100; at += s.ms; return `<div class="shot" style="left:${left}%;width:${(s.ms / total) * 100}%">${esc(s.id)}</div>`; }).join('');
      const notes = (S.notes || []).filter((n) => n.versionNo === viewVersion && n.atMs != null);
      $('ticks').innerHTML = notes.map((n) => `<div class="tick" style="left:${clamp(n.atMs / total) * 100}%" title="${esc(n.author.name)}: ${esc(n.body)}"></div>`).join('');
    }

    // ---------- pointing: hand (MediaPipe), mouse, pins ----------
    let hand = null;   // {x, y, pointing, seen}
    let mouse = null;  // {x, y, seen}
    let locked = null; // {x, y, atMs, versionNo, at, how}
    let landmarker = null;
    let lastDetect = 0;
    let wasPinch = false;
    let lastCursorSent = 0;

    const cursorNow = () => {
      if (hand && Date.now() - hand.seen < 500) return hand;
      if (mouse && Date.now() - mouse.seen < 4000) return mouse;
      return null;
    };
    function lockAnchor(how, pt = cursorNow()) {
      if (!pt || !viewVersion) return false;
      locked = { x: pt.x, y: pt.y, atMs: Math.round(reel.currentTime * 1000), versionNo: viewVersion, at: Date.now(), how };
      $('pinnedText').textContent = `📍 Spot pinned at ${fmt(locked.atMs)} · say or type what to put there`;
      $('pinnedChip').classList.remove('hidden');
      broadcast({ t: 'cursor', x: pt.x, y: pt.y, on: true, pointing: true, v: viewVersion, pin: true });
      return true;
    }
    function unlock() { locked = null; $('pinnedChip').classList.add('hidden'); }
    $('unpin').addEventListener('click', unlock);
    function anchorFor(via) {
      if (locked && Date.now() - locked.at < 20_000) return { x: locked.x, y: locked.y, atMs: locked.atMs, versionNo: locked.versionNo };
      const pt = via === 'voice' ? cursorNow() : null;
      return pt && viewVersion ? { x: pt.x, y: pt.y, atMs: Math.round(reel.currentTime * 1000), versionNo: viewVersion } : null;
    }
    function sendCursor(pt) {
      if (Date.now() - lastCursorSent < 50) return;
      lastCursorSent = Date.now();
      broadcast(pt ? { t: 'cursor', x: pt.x, y: pt.y, on: true, pointing: Boolean(pt.pointing), v: viewVersion } : { t: 'cursor', on: false });
    }

    const stage = $('stage');
    const stagePoint = (e) => { const r = stage.getBoundingClientRect(); return { x: clamp((e.clientX - r.left) / r.width), y: clamp((e.clientY - r.top) / r.height) }; };
    stage.addEventListener('pointermove', (e) => { if (hand && Date.now() - hand.seen < 500) return; mouse = { ...stagePoint(e), seen: Date.now() }; sendCursor(mouse); });
    stage.addEventListener('pointerleave', () => { mouse = null; sendCursor(null); });
    stage.addEventListener('pointerdown', (e) => { mouse = { ...stagePoint(e), seen: Date.now() }; if (lockAnchor('click', mouse)) $('cmd').focus(); });

    async function startHands() {
      if (!local?.getVideoTracks().length) { $('handState').textContent = 'No camera · click to point'; return; }
      $('handState').textContent = 'Loading hand tracking…';
      try {
        const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
        const vision = await import(`${base}/vision_bundle.mjs`);
        const fileset = await vision.FilesetResolver.forVisionTasks(`${base}/wasm`);
        const model = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
        const create = (delegate) => vision.HandLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: model, delegate }, runningMode: 'VIDEO', numHands: 1 });
        try { landmarker = await create('GPU'); } catch { landmarker = await create('CPU'); }
        $('handState').textContent = 'Raise a hand and point';
        requestAnimationFrame(handLoop);
      } catch (err) {
        console.warn('[live] hand tracking unavailable', err);
        $('handState').textContent = 'Hand tracking unavailable · click to point';
      }
    }
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    function handLoop(now) {
      requestAnimationFrame(handLoop);
      const cam = $('selfCam');
      if (!landmarker || cam.readyState < 2 || now - lastDetect < 45) return;
      const track = local?.getVideoTracks()[0];
      if (!track?.enabled) return;
      lastDetect = now;
      const res = landmarker.detectForVideo(cam, now);
      const lm = res.landmarks?.[0];
      drawHand(lm);
      if (!lm) {
        if (hand && Date.now() - hand.seen > 500) { hand = null; sendCursor(null); $('handState').textContent = 'Raise a hand and point'; }
        return;
      }
      const ext = (tip, pip) => dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.12;
      const curled = [[12, 10], [16, 14], [20, 18]].filter(([t, p]) => !ext(t, p)).length;
      const pointing = ext(8, 6) && curled >= 2;
      const pinch = dist(lm[4], lm[8]) < 0.33 * dist(lm[0], lm[9]);
      // The middle of the camera frame maps onto the whole reel, so you don't have to reach the edges.
      const tx = clamp(((1 - lm[8].x) - 0.2) / 0.6);
      const ty = clamp((lm[8].y - 0.12) / 0.62);
      const k = hand ? 0.45 : 1;
      hand = { x: hand ? hand.x + (tx - hand.x) * k : tx, y: hand ? hand.y + (ty - hand.y) * k : ty, pointing, seen: Date.now() };
      let handLabel = 'Hand seen';
      if (pinch) handLabel = 'Pinned';
      else if (pointing) handLabel = 'Pointing';
      $('handState').textContent = handLabel;
      if (pinch && !wasPinch) lockAnchor('pinch', hand);
      wasPinch = pinch;
      sendCursor(hand);
    }
    const HAND_LINKS = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
    function drawHand(lm) {
      const c = $('handCanvas');
      const w = c.clientWidth, h = c.clientHeight;
      if (c.width !== w) c.width = w;
      if (c.height !== h) c.height = h;
      const g = c.getContext('2d');
      g.clearRect(0, 0, w, h);
      g.strokeStyle = 'rgba(253,251,4,.35)';
      g.setLineDash([6, 6]);
      g.strokeRect(0.2 * w, 0.12 * h, 0.6 * w, 0.62 * h);
      g.setLineDash([]);
      if (!lm) return;
      g.strokeStyle = 'rgba(253,251,4,.9)';
      g.lineWidth = 2;
      for (const [a, b] of HAND_LINKS) { g.beginPath(); g.moveTo(lm[a].x * w, lm[a].y * h); g.lineTo(lm[b].x * w, lm[b].y * h); g.stroke(); }
      g.fillStyle = me?.color || '#E4572E';
      g.beginPath(); g.arc(lm[8].x * w, lm[8].y * h, 7, 0, Math.PI * 2); g.fill();
    }

    // Everything drawn over the reel: cursors, pinned spot, edits in flight, notes at this moment.
    const tempPins = new Map();
    function drawLoop() {
      requestAnimationFrame(drawLoop);
      const out = [];
      const nowMs = reel.currentTime * 1000;
      const pinHtml = (x, y, cls, tag, sub) => `<div class="pin ${cls}" style="left:${x * 100}%;top:${y * 100}%"><div class="tag">${tag}${sub ? `<small>${sub}</small>` : ''}</div><div class="stem"></div><div class="spot"></div></div>`;
      if (S) {
        const flying = S.jobs.filter((j) => (j.status === 'queued' || j.status === 'running') && j.anchor?.x != null);
        for (const j of flying) {
          if (j.anchor.versionNo && j.anchor.versionNo !== viewVersion) continue;
          out.push(pinHtml(j.anchor.x, j.anchor.y, '', `${esc(j.author || 'Someone')}: “${esc(j.said)}”`, esc(j.status === 'queued' ? 'Up next' : STAGES[j.stage] || 'Working')));
        }
        for (const [id, t] of tempPins) {
          if (Date.now() - t.at > 25_000 || flying.some((j) => j.said === t.said)) { tempPins.delete(id); continue; }
          if (t.versionNo === viewVersion) out.push(pinHtml(t.x, t.y, '', `${esc(t.name)}: “${esc(t.said)}”`, 'Sticky heard you'));
        }
        for (const n of S.notes) {
          if (n.versionNo !== viewVersion || n.atMs == null || n.x == null || Math.abs(n.atMs - nowMs) > 900) continue;
          out.push(pinHtml(n.x, n.y, 'note', `${esc(n.author.name)}: ${esc(n.body)}`, 'note'));
        }
      }
      if (locked && Date.now() - locked.at < 20_000 && locked.versionNo === viewVersion) out.push(pinHtml(locked.x, locked.y, 'mine', 'Your spot', 'say what goes here'));
      for (const p of peers.values()) {
        const c = p.cursor;
        if (!c?.on || Date.now() - c.seen > 1500 || (c.v && c.v !== viewVersion)) continue;
        out.push(`<div class="cursor${c.pointing ? ' pointing' : ''}" style="left:${c.x * 100}%;top:${c.y * 100}%;--c:${p.info.color}"><i></i><span>${esc(p.info.name)}</span></div>`);
      }
      const mine = cursorNow();
      if (mine) out.push(`<div class="cursor${mine.pointing ? ' pointing' : ''}" style="left:${mine.x * 100}%;top:${mine.y * 100}%;--c:${me?.color || '#E4572E'}"><i></i><span>You</span></div>`);
      const html = out.join('');
      if (html !== drawLoop.last) { $('layer').innerHTML = html; drawLoop.last = html; }
      // transport
      const d = reel.duration || 0;
      const f = d ? (reel.currentTime / d) * 100 : 0;
      $('fill').style.width = `${f}%`;
      $('head').style.left = `${f}%`;
      $('clock').textContent = `${fmt(reel.currentTime * 1000)} / ${fmt(d * 1000)}`;
    }

    // ---------- voice: "Sticky, …" or hold Space ----------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let listening = false;
    let pttUntil = 0;
    let spaceDown = false;
    let utterLocked = false;
    let lastCapSent = 0;
    const pushToTalk = () => spaceDown || Date.now() < pttUntil;
    const commanding = (text) => pushToTalk() || WAKE.test(text);
    function startListening() {
      if (!SR) { $('listenBtn').textContent = 'Voice needs Chrome, Edge or Safari'; $('listenBtn').disabled = true; return; }
      if (!local?.getAudioTracks().length) { $('listenBtn').textContent = 'Mic off · type below'; $('listenBtn').classList.remove('listen'); return; }
      listening = true;
      $('listenBtn').textContent = 'Sticky is listening';
      $('listenBtn').classList.add('listen');
      rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = navigator.language || 'en-US';
      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          const text = r[0].transcript.trim();
          if (!text) continue;
          showCap($('meCap'), text, $('meCap'));
          if (r.isFinal || Date.now() - lastCapSent > 300) { lastCapSent = Date.now(); broadcast({ t: 'cap', text, final: r.isFinal }); }
          // "here" is wherever you were pointing when you said it, not where your hand is a second later.
          if (!utterLocked && DEICTIC.test(text) && commanding(text)) utterLocked = lockAnchor('voice');
          if (r.isFinal) { onFinal(text); utterLocked = false; }
        }
      };
      rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { listening = false; $('listenBtn').textContent = 'Voice blocked · type below'; } };
      rec.onend = () => { if (listening) setTimeout(() => { try { rec.start(); } catch {} }, 250); };
      try { rec.start(); } catch {}
    }
    function stopListening() { listening = false; try { rec?.stop(); } catch {} $('listenBtn').textContent = 'Sticky is not listening'; $('listenBtn').classList.remove('listen', 'hot'); }
    $('listenBtn').addEventListener('click', () => (listening ? stopListening() : startListening()));
    // "Sticky, …" is a command; with Space held (or just let go), whatever you said is.
    function onFinal(text) {
      const m = WAKE.exec(text);
      let cmd = null;
      if (m) cmd = m[1];
      else if (pushToTalk()) cmd = text;
      if (cmd && cmd.trim().length > 1) submit(cmd.trim(), 'voice');
      else feed({ kind: 'said', who: 'You', color: me?.color, text });
    }
    addEventListener('keydown', (e) => {
      if (e.code !== 'Space' || e.repeat || e.target.closest('input, textarea, button')) return;
      e.preventDefault();
      spaceDown = true;
      $('listenBtn').classList.add('hot');
      $('listenBtn').textContent = 'Talking to Sticky…';
    });
    addEventListener('keyup', (e) => {
      if (e.code !== 'Space' || !spaceDown) return;
      spaceDown = false;
      pttUntil = Date.now() + 1800; // the final transcript lands a moment after you let go
      $('listenBtn').classList.remove('hot');
      $('listenBtn').textContent = listening ? 'Sticky is listening' : 'Sticky is not listening';
    });

    // ---------- commands + notes ----------
    async function submit(text, via) {
      const anchor = anchorFor(via);
      const mentions = pickedMentions.filter((m) => text.includes(`@${m.name}`)).map((m) => m.handle);
      if (NOTE.test(text) || mentions.length) {
        const body = text.replace(NOTE, '').trim() || text;
        const r = await post('/note', { person: personId, body, mentions, anchor });
        if (r.ok) { toast('Note added'); unlock(); } else toast('Couldn’t add that note.');
        pickedMentions = [];
        return;
      }
      const reqId = hex(4);
      if (anchor) tempPins.set(reqId, { ...anchor, said: text, name: 'You', at: Date.now() });
      feed({ kind: 'cmd', who: 'You', color: me?.color, text, anchor });
      const r = await post('/say', { peer: peerId, person: personId, text, anchor, reqId });
      if (!r.ok) toast('Sticky didn’t get that. Try again.');
      unlock();
    }
    $('composer').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = $('cmd').value.trim();
      if (!t) return;
      $('cmd').value = '';
      closeMentions();
      submit(t, 'typed');
    });

    // @mentions from the host's network.
    let pickedMentions = [];
    let mentionIdx = 0;
    function mentionQuery() {
      const i = $('cmd').selectionStart;
      const m = /@([\p{L}\w-]*)$/u.exec($('cmd').value.slice(0, i));
      return m ? m[1].toLowerCase() : null;
    }
    function closeMentions() { $('mentionPop').classList.add('hidden'); }
    function openMentions() {
      const qy = mentionQuery();
      const list = qy === null ? [] : (S?.network || []).filter((p) => p.name.toLowerCase().includes(qy)).slice(0, 6);
      if (!list.length) return closeMentions();
      mentionIdx = Math.min(mentionIdx, list.length - 1);
      $('mentionPop').innerHTML = list.map((p, i) => `<button type="button" role="option" data-h="${p.handle}" aria-selected="${i === mentionIdx}">@${esc(p.name)}<small>${p.hasPhone ? 'gets a text' : 'in the app'}</small></button>`).join('');
      $('mentionPop').classList.remove('hidden');
    }
    function pickMention(handle) {
      const p = S.network.find((x) => x.handle === handle);
      if (!p) return;
      const el = $('cmd');
      const i = el.selectionStart;
      const before = el.value.slice(0, i).replace(/@[\p{L}\w-]*$/u, `@${p.name} `);
      el.value = before + el.value.slice(i);
      el.setSelectionRange(before.length, before.length);
      pickedMentions.push({ handle: p.handle, name: p.name });
      closeMentions();
      el.focus();
    }
    $('cmd').addEventListener('input', () => { mentionIdx = 0; openMentions(); });
    $('cmd').addEventListener('keydown', (e) => {
      if ($('mentionPop').classList.contains('hidden')) return;
      const n = $('mentionPop').children.length;
      if (e.key === 'ArrowDown') { e.preventDefault(); mentionIdx = (mentionIdx + 1) % n; openMentions(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); mentionIdx = (mentionIdx - 1 + n) % n; openMentions(); }
      else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention($('mentionPop').children[mentionIdx].dataset.h); }
      else if (e.key === 'Escape') closeMentions();
    });
    $('mentionPop').addEventListener('mousedown', (e) => { const b = e.target.closest('[data-h]'); if (b) { e.preventDefault(); pickMention(b.dataset.h); } });

    // ---------- room feed ----------
    function feed(ev) {
      const el = document.createElement('div');
      const where = ev.anchor ? `<span class="where">📍 ${Math.round(ev.anchor.x * 100)}% × ${Math.round(ev.anchor.y * 100)}% at ${fmt(ev.anchor.atMs)}${ev.anchor.versionNo ? ` of v${ev.anchor.versionNo}` : ''}</span>` : '';
      el.className = `ev ${ev.kind}`;
      if (ev.kind === 'sys') el.textContent = ev.text;
      else if (ev.kind === 'sticky') el.innerHTML = `<span class="who"></span>${esc(ev.text)}`;
      else el.innerHTML = `<span class="who" style="color:${ev.color || 'inherit'}">${esc(ev.who)}</span>${ev.kind === 'cmd' ? ' → Sticky: ' : ': '}${esc(ev.text)}${where}`;
      const box = $('tab-feed');
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
      $('feed').appendChild(el);
      while ($('feed').children.length > 200) $('feed').firstChild.remove();
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    // ---------- tabs ----------
    document.querySelector('.tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      for (const x of document.querySelectorAll('.tabs [data-tab]')) x.setAttribute('aria-selected', String(x === b));
      for (const id of ['feed', 'history', 'notes']) $(`tab-${id}`).classList.toggle('hidden', id !== b.dataset.tab);
    });

    // ---------- history: every version, who asked, from where, pointing at what ----------
    const CHANNEL = { sms: 'texted', web: 'web', live: 'live' };
    const ORIGIN = { sms: 'Texted in', web: 'From the web page' };
    function renderHistory() {
      const flying = S.jobs.filter((j) => j.status === 'queued' || j.status === 'running');
      const settled = S.jobs.filter((j) => j.status === 'failed' || (j.status === 'done' && (j.error || '').startsWith('unsupported')));
      $('histCount').textContent = S.versions.length ? ` ${S.versions.length}` : '';
      const rows = [];
      for (const j of flying) {
        rows.push(`<div class="item"><div class="top"><span class="chip live">${j.status === 'queued' ? 'Up next' : 'Working'}</span><span class="said">“${esc(j.said || 'First cut')}”</span></div>
          <div class="muted">${esc(j.author ? `${j.author} · ${CHANNEL[j.channel] || 'live'}` : CHANNEL[j.channel] || '')}${j.status === 'running' ? ` · ${esc(STAGES[j.stage] || j.stage || '')}` : ''}</div>
          ${j.anchor?.where ? `<div class="muted">📍 ${esc(j.anchor.where)}</div>` : ''}</div>`);
      }
      for (const v of [...S.versions].reverse()) {
        const by = v.author ? v.author.name : ORIGIN[v.channel] || '';
        rows.push(`<div class="item">
          <div class="top"><span class="vno">v${v.versionNo}</span><span class="chip">${fmt(v.durationMs)}</span>${v.channel ? `<span class="chip${v.channel === 'live' ? ' live' : ''}">${CHANNEL[v.channel] || v.channel}</span>` : ''}${v.kept ? '<span class="chip yl">★ kept</span>' : ''}${v.finalSentAt ? '<span class="chip ok">✉ texted to host</span>' : ''}</div>
          ${v.direction ? `<div class="said">“${esc(v.direction)}”</div>` : '<div class="said">First cut</div>'}
          <div class="muted">${esc(by)}${v.parent ? ` · changed v${v.parent}` : ''} · ${new Date(v.createdAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</div>
          ${v.anchor?.where ? `<div class="muted">📍 ${esc(v.anchor.where)} (pointed at ${fmt(v.anchor.atMs)})</div>` : ''}
          <div class="muted">${esc(v.explanation)}</div>
          <button class="link" type="button" data-view="${v.versionNo}">${v.versionNo === viewVersion ? 'On stage' : 'Show everyone'}</button>
        </div>`);
      }
      for (const j of settled.slice(0, 6)) {
        rows.push(`<div class="item"><div class="top"><span class="chip bad">Not made</span><span class="said">“${esc(j.said)}”</span></div><div class="muted">${esc((j.error || '').replace(/^unsupported: /, ''))}</div></div>`);
      }
      $('historyList').innerHTML = rows.join('') || '<div class="muted" style="color:var(--ink-2)">No versions yet.</div>';
    }
    $('historyList').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (!b) return; setVersion(Number(b.dataset.view), true); sendView(); });

    // ---------- notes ----------
    const STATUS = { texted: 'texted', no_phone: 'no phone on file', failed: 'text failed' };
    function renderNotes() {
      const byHandle = new Map((S.network || []).map((p) => [p.handle, p.name]));
      $('noteCount').textContent = S.notes.length ? ` ${S.notes.length}` : '';
      $('notesList').innerHTML = [...S.notes].reverse().map((n) => {
        let body = esc(n.body);
        for (const h of n.mentions) { const name = byHandle.get(h); if (name) body = body.replace(new RegExp(`@?${esc(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i'), (s) => `<span class="mention">${s}</span>`); }
        const tags = n.mentions.map((h) => `<span class="chip">@${esc(byHandle.get(h) || '?')}${n.notified[h] ? ` · ${STATUS[n.notified[h]] || n.notified[h]}` : ''}</span>`).join(' ');
        return `<div class="item"><div class="top"><b>${esc(n.author.name)}</b>${n.atMs != null ? `<button class="chip" type="button" data-seek="${n.versionNo || ''}:${n.atMs}">${fmt(n.atMs)}${n.versionNo ? ` · v${n.versionNo}` : ''}</button>` : ''}</div><div>${body}</div>${tags ? `<div>${tags}</div>` : ''}</div>`;
      }).join('') || '<div style="color:var(--ink-2);font-size:13px">Say “Sticky, note for Sam: tighten the intro”, or type a note with @name. Notes pin to the moment and spot you’re on.</div>';
    }
    $('notesList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-seek]');
      if (!b) return;
      const [v, ms] = b.dataset.seek.split(':').map(Number);
      if (v && v !== viewVersion) setVersion(v);
      reel.pause();
      reel.currentTime = ms / 1000;
      sendView();
    });

    // ---------- people, invite, finish ----------
    function renderAvatars() {
      const list = [me && { name: me.name, color: me.color }, ...[...peers.values()].map((p) => p.info)].filter(Boolean);
      $('avatars').innerHTML = list.map((p) => `<span class="av" style="background:${p.color}" title="${esc(p.name)}">${esc(initials(p.name))}</span>`).join('');
    }
    function renderHostBits() {
      const host = S.role === 'host';
      $('finishBtn').classList.toggle('hidden', !host);
      $('contactForm').classList.toggle('hidden', !host);
      $('guestLink').value = `${location.origin}${S.guestLink}`;
      $('networkList').innerHTML = (S.network || []).map((p) => `<div class="person"><span class="nm">${esc(p.name)}</span><span class="chip">${p.hasPhone ? 'has phone' : 'no phone'}</span>${host && p.hasPhone ? `<button class="btn small" type="button" data-invite="${p.handle}">Text invite</button>` : ''}</div>`).join('') || '<div class="sub">No one yet.</div>';
      if (!$('joinView').classList.contains('hidden')) renderJoin();
    }
    const openPop = (id) => { for (const p of document.querySelectorAll('.pop')) p.classList.toggle('hidden', p.id !== id); };
    document.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) e.target.closest('.pop').classList.add('hidden'); });
    $('inviteBtn').addEventListener('click', () => openPop('invitePop'));
    $('copyLink').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('guestLink').value); toast('Link copied'); } catch { $('guestLink').select(); } });
    $('networkList').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-invite]');
      if (!b) return;
      b.disabled = true;
      const r = await post('/invite', { handle: b.dataset.invite });
      toast(r.ok ? 'Invite texted' : r.body.error || 'Couldn’t text the invite');
      b.disabled = false;
    });
    $('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await post('/contact', { name: $('contactName').value, phone: $('contactPhone').value });
      if (!r.ok) return toast(r.body.error || 'Couldn’t add them');
      $('contactName').value = ''; $('contactPhone').value = '';
      toast('Added to your network');
      refresh();
    });
    $('finishBtn').addEventListener('click', () => {
      const v = viewVersion;
      const needPhone = S.project.origin === 'web' && !S.host.phoneOnFile;
      const sub = $('finishSub');
      if (!v) sub.textContent = 'There’s no cut yet.';
      else if (S.project.origin === 'imessage') sub.textContent = `v${v} goes back into the iMessage thread this reel came from.`;
      else if (needPhone) sub.textContent = `Add your phone and Sticky texts v${v} to it.`;
      else sub.textContent = `v${v} goes to your phone ending in ${S.host.phoneLast4}.`;
      $('finishPhoneWrap').classList.toggle('hidden', !needPhone);
      $('finishGo').textContent = v ? `Text v${v} to me` : 'Text it to me';
      $('finishGo').disabled = !v;
      $('finishErr').textContent = '';
      openPop('finishPop');
    });
    $('finishGo').addEventListener('click', async () => {
      $('finishGo').disabled = true;
      $('finishErr').textContent = '';
      if (!$('finishPhoneWrap').classList.contains('hidden')) {
        const r = await post('/phone', { phone: $('finishPhone').value });
        if (!r.ok) { $('finishErr').textContent = r.body.error || 'That number didn’t work.'; $('finishGo').disabled = false; return; }
      }
      $('finishGo').textContent = 'Sending…';
      const r = await post('/finish', { versionNo: viewVersion });
      $('finishGo').disabled = false;
      $('finishGo').textContent = `Text v${viewVersion} to me`;
      if (r.ok) { $('finishPop').classList.add('hidden'); toast(`Texted v${r.body.versionNo}${r.body.how === 'link' ? ' as a link' : ''}`); refresh(); }
      else $('finishErr').textContent = r.body.error === 'need_phone' ? 'Add your phone number first.' : `Couldn’t text it: ${r.body.error || 'unknown error'}`;
    });

    // ---------- local media controls ----------
    $('micBtn').addEventListener('click', () => {
      const t = local?.getAudioTracks()[0];
      if (!t) return;
      t.enabled = !t.enabled;
      $('micBtn').textContent = t.enabled ? 'Mic on' : 'Mic muted';
      $('micBtn').classList.toggle('off', !t.enabled);
    });
    $('camBtn').addEventListener('click', () => {
      const t = local?.getVideoTracks()[0];
      if (!t) return;
      t.enabled = !t.enabled;
      $('camBtn').textContent = t.enabled ? 'Camera on' : 'Camera off';
      $('camBtn').classList.toggle('off', !t.enabled);
      $('meInitials').classList.toggle('hidden', t.enabled);
      if (!t.enabled) { hand = null; drawHand(null); }
    });

    // ---------- boot ----------
    await loadState();
    renderJoin();
    preview();
  </script>
</body>
</html>
